name: Inspect Autonomy Bootstrap anchors

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-autonomy-bootstrap-anchors.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect runnable entry points and goal creation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp181
          mkdir -p tmp181
          unzip -q ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip -d tmp181

          echo '=== CLI / work mode entry points ==='
          grep -RInE 'def main\(|argparse|/api/project|/api/goal|create_project|submit_goal|start_project|new objective|objective' tmp181/scripts tmp181/ceo_core --include='*.py' | head -n 2200 || true

          echo '=== local provider ==='
          sed -n '1,320p' tmp181/ceo_core/goal_lock_local_provider_v1.py

          echo '=== project creation / engine methods ==='
          grep -nE 'async def .*project|def .*project|create_project|start_project|new_project|set_goal|goal=' tmp181/scripts/ceo_stdlib_work_mode.py | head -n 1400 || true

          echo '=== API routes POST ==='
          grep -nE 'do_POST|/api/' tmp181/scripts/ceo_stdlib_work_mode.py | head -n 1700 || true

          echo '=== artifact / file write helpers ==='
          grep -RInE 'write_text\(|write_bytes\(|artifact|deliverable|output_path|workspace' tmp181/ceo_core --include='*.py' | head -n 1700 || true
