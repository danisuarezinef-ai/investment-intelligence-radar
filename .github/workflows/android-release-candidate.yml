name: Android Release Candidate CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-rc-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Android launch contracts
        run: python -m pytest -q tests/test_android_launch_v1.py
      - name: Compile Android release contracts
        run: python -m compileall -q radar_android_launch_v1.py radar_android_package_v1.py radar_android_adversarial_v1.py radar_android_release_candidate_v1.py
      - name: Enforce PAPER-only boundary
        run: |
          python - <<'PY'
          import radar_android_launch_v1 as a
          import radar_android_package_v1 as p
          import radar_android_adversarial_v1 as x
          import radar_android_release_candidate_v1 as rc
          assert a.REAL_TRADING is False
          assert p.REAL_TRADING is False
          assert x.REAL_TRADING is False
          assert rc.REAL_TRADING is False
          assert rc.rc_gate({})["status"] == "NOT_VERIFIED"
          PY
