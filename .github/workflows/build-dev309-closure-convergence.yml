name: Build DEV309 Closure Convergence

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/build-dev309-closure-convergence.yml'
      - 'ceo-updates/build_dev309_closure_convergence.py'
      - 'ceo-updates/qualify_dev309_closure_convergence.py'

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build DEV309 candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ceo-dev309'
          $env:CEO_DEV309_BUILD_ROOT=$root
          python ceo-updates\build_dev309_closure_convergence.py
          if($LASTEXITCODE -ne 0){throw 'DEV309 build failed'}
          "CEO_DEV309_BUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_GATE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_NO_BROWSER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LOCALAPPDATA=$(Join-Path $env:RUNNER_TEMP 'dev309-local')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APPDATA=$(Join-Path $env:RUNNER_TEMP 'dev309-roaming')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_GATE_ARTIFACTS=$(Join-Path $env:RUNNER_TEMP 'dev309-gates')" | Out-File -FilePath $env:GITHUB_ENV -Append
          python -m pip install --disable-pip-version-check -q -e $root

      - name: Compile and DEV309 focused qualification
        shell: pwsh
        run: |
          Push-Location $env:CEO_DEV309_BUILD_ROOT
          python -m compileall -q .
          if($LASTEXITCODE -ne 0){throw 'compile failed'}
          Pop-Location
          python ceo-updates\qualify_dev309_closure_convergence.py
          if($LASTEXITCODE -ne 0){throw 'DEV309 focused qualification failed'}

      - name: Inherited safety and updater regression
        shell: pwsh
        run: |
          Push-Location $env:CEO_DEV309_BUILD_ROOT
          python scripts\dev292_recovery_failclosed_qualification.py
          if($LASTEXITCODE -ne 0){throw 'DEV292 regression failed'}
          python scripts\dev294_internal_update_pipeline_qualification.py
          if($LASTEXITCODE -ne 0){throw 'DEV294 regression failed'}
          python scripts\dev295_update_confirm_qualification.py
          if($LASTEXITCODE -ne 0){throw 'DEV295 regression failed'}
          python scripts\security_audit.py
          if($LASTEXITCODE -ne 0){throw 'security audit failed'}
          Pop-Location

      - name: Re-run identical Autonomy Bootstrap Gates 1-6
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CEO_GATE_ARTIFACTS | Out-Null
          python ceo-updates\autonomy_bootstrap_gate_v1.py
          if($LASTEXITCODE -ne 0){throw 'ABG1 failed'}
          python ceo-updates\autonomy_bootstrap_gate_v2.py
          if($LASTEXITCODE -ne 0){throw 'ABG2 failed'}
          python ceo-updates\autonomy_bootstrap_gate_v3.py
          if($LASTEXITCODE -ne 0){throw 'ABG3 failed'}
          python ceo-updates\autonomy_bootstrap_gate_v4.py
          if($LASTEXITCODE -ne 0){throw 'ABG4 failed'}
          python ceo-updates\autonomy_bootstrap_gate_v5.py
          if($LASTEXITCODE -ne 0){throw 'ABG5 failed'}
          python ceo-updates\autonomy_bootstrap_gate_v6.py
          if($LASTEXITCODE -ne 0){throw 'ABG6 failed'}

      - name: Package deterministic DEV309
        shell: pwsh
        run: |
          @'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['CEO_DEV309_BUILD_ROOT'])
          outdir=pathlib.Path('ceo-updates')
          version='1.5.85-rc1-closure-convergence'
          artifact=f'CEO_{version}.zip'
          out=outdir/artifact
          out.unlink(missing_ok=True)
          contract=json.loads((root/'CEO_UPDATE_PACKAGE.json').read_text(encoding='utf-8'))
          assert contract['app_version']==version
          required=sorted(contract['required_paths'])
          fixed=(2026,9,21,9,10,0)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in required:
                  p=root/rel
                  assert p.is_file(),rel
                  info=zipfile.ZipInfo(rel,date_time=fixed)
                  info.create_system=0
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          data=out.read_bytes(); sha=hashlib.sha256(data).hexdigest(); size=len(data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(required)
          manifest={
              'artifact_name':artifact,'channel':'stable','data_schema_version':1,
              'health_path':'/api/health','launcher':'ABRIR_CEO.cmd','manifest_version':2,
              'max_app_version':'','min_app_version':'1.5.84-rc1-executable-route-integrity',
              'notes':'DEV309 Closure Convergence: explicit file deliverables are locked from goal text; AI workers can request guarded workspace-local writes that CEO materializes, hashes and registers; completion audits receive concrete evidence task IDs and use deterministic valid evidence selection; single-artifact goals use bounded completion thresholds; continuity generation is capped and historical #173 loops migrate into a fresh bounded closure epoch.',
              'package_contract_version':1,'published_at':'2026-09-21T09:10:00Z',
              'release_id':'dev309-1.5.85-rc1-closure-convergence','release_sequence':309,
              'release_status':'release','sha256':sha,'signature_alg':'ed25519','size_bytes':size,
              'url':'https://raw.githubusercontent.com/danisuarezinef-ai/investment-intelligence-radar/ceo-update-channel/ceo-updates/'+artifact,
              'version':version,
          }
          qualification={
              'candidate':version,'base':'1.5.84-rc1-executable-route-integrity',
              'release_sequence':309,'tests_passed':True,'security_passed':True,
              'explicit_file_deliverable_inference':True,
              'guarded_workspace_write_protocol':True,
              'artifact_registration_and_hash_evidence':True,
              'audit_evidence_candidates_with_real_task_ids':True,
              'deterministic_auto_evidence_refs':True,
              'field_173_loop_migration':True,
              'goal_continuity_generation_cap':True,
              'autonomy_bootstrap_gates_1_6_repassed':True,
              'windows_build_and_focused_tests_passed':True,
              'windows_stage_preflight_passed':False,
              'field_validation_pending':True,'production_ready':False,
              'operator_install_confirmation_required':True,
              'artifact':{'name':artifact,'sha256':sha,'size_bytes':size,'entries':len(required)},
          }
          (outdir/'DEV309_MANIFEST_UNSIGNED.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (outdir/'DEV309_QUALIFICATION.json').write_text(json.dumps(qualification,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(qualification,indent=2))
          '@ | Set-Content -Encoding UTF8 package309.py
          python package309.py
          if($LASTEXITCODE -ne 0){throw 'package failed'}

      - name: Commit DEV309 candidate
        shell: pwsh
        run: |
          git config user.name "CEO Reliability Engineering"
          git config user.email "ceo-reliability@local.invalid"
          git add ceo-updates/CEO_1.5.85-rc1-closure-convergence.zip ceo-updates/DEV309_MANIFEST_UNSIGNED.json ceo-updates/DEV309_QUALIFICATION.json
          git commit -m "Stage DEV309 closure convergence candidate"
          git push origin HEAD:ceo-update-channel
