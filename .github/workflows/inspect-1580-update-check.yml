name: Inspect 1.5.80 updater says up-to-date

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-1580-update-check.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect updater check and anti-replay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp180
          mkdir -p tmp180
          unzip -q ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip -d tmp180
          echo '=== updater check ==='
          grep -RInE 'check_for_update|manifest|release_sequence|anti.?replay|up.to.date|current_version|last_seen|last_release|channel' tmp180/ceo_core tmp180/scripts --include='*.py' | head -n 2200 || true
          echo '=== in_app_updater ==='
          sed -n '1,520p' tmp180/ceo_core/in_app_updater.py
          echo '=== update channel ==='
          cat tmp180/ceo_core/update_channel.py
