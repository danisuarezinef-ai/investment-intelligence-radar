name: CEO W8 Productivity Truth Audit

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - 'ceo-browser/w8_productivity_truth_regression.py'
      - '.github/workflows/ceo-w8-productivity-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w8:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3"
      - name: Audit raw 1.5.92 productive truth
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w8"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force
          $env:CEO_W8_ROOT=$root
          Write-Host "W8_PROGRESS_TRACKER_SOURCE_BEGIN"
          Get-Content (Join-Path $root "ceo_core\progress_tracker.py")
          Write-Host "W8_PROGRESS_TRACKER_SOURCE_END"
          python ceo-browser\w8_productivity_truth_regression.py
          if($LASTEXITCODE -ne 0){throw "W8 productivity truth regression failed"}
          Write-Host "W8_WINDOWS_CI_PASS"
