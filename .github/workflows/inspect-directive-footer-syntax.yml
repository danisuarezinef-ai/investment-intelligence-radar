name: Inspect directive footer syntax only

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-directive-footer-syntax.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Print result protocol
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp181
          mkdir -p tmp181
          unzip -q ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip -d tmp181
          sed -n '1,120p' tmp181/ceo_core/result_protocol.py
