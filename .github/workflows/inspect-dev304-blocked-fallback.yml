name: Inspect DEV304 blocked fallback exact

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev304-blocked-fallback.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Exact blocked fallback
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp180
          mkdir -p tmp180
          unzip -q ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip -d tmp180
          echo '=== fallback orchestrator ==='
          cat tmp180/ceo_core/productive_fallback_orchestrator_v1.py
          echo '=== churn fuse ==='
          cat tmp180/ceo_core/recovery_churn_fuse_v2.py
          echo '=== scheduler around completion ==='
          sed -n '430,710p' tmp180/ceo_core/scheduler.py
          echo '=== autonomous loop ensure progress ==='
          sed -n '250,520p' tmp180/ceo_core/autonomous_loop.py
          echo '=== productive truth ==='
          cat tmp180/ceo_core/productive_truth_v2.py
