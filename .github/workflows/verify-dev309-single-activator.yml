name: Verify DEV309 single activator

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev309-single-activator.yml'
      - 'ceo-updates/ACTIVAR_DEV309_CLOSURE_CONVERGENCE_UNICO.cmd'
      - 'ceo-updates/DEV309_CLOSURE_CONVERGENCE_ACTIVAR.ps1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start mock CEO 1.5.84
        shell: pwsh
        run: |
          @'
          import json
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          from pathlib import Path

          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def sendj(self,row,code=200):
                  b=json.dumps(row).encode()
                  self.send_response(code)
                  self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)
              def do_GET(self):
                  if self.path=='/api/health':
                      return self.sendj({'ok':True,'version':'1.5.84-rc1-executable-route-integrity'})
                  if self.path.startswith('/api/update/status'):
                      return self.sendj({
                          'current_version':'1.5.84-rc1-executable-route-integrity',
                          'available':True,
                          'remote':{'version':'1.5.85-rc1-closure-convergence'}
                      })
                  return self.sendj({'error':'not_found'},404)
              def do_POST(self):
                  n=int(self.headers.get('Content-Length') or 0)
                  body=self.rfile.read(n)
                  Path('dev309-request.json').write_bytes(body)
                  if self.path=='/api/internal-release/activate-prepared':
                      return self.sendj({
                          'ok':True,
                          'status':'PUBLISHED',
                          'version':'1.5.85-rc1-closure-convergence',
                          'remote_verified':True
                      })
                  return self.sendj({'error':'not_found'},404)

          ThreadingHTTPServer(('127.0.0.1',8775),H).serve_forever()
          '@ | Set-Content -Encoding UTF8 mock309.py
          Start-Process python -ArgumentList "mock309.py" -WindowStyle Hidden
          Start-Sleep -Seconds 2

      - name: Run DEV309 single activator
        shell: cmd
        env:
          CEO_ACTIVATOR_NO_PAUSE: "1"
          CEO_ACTIVATOR_NO_BROWSER: "1"
        run: |
          call ceo-updates\ACTIVAR_DEV309_CLOSURE_CONVERGENCE_UNICO.cmd
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify request and log
        shell: pwsh
        run: |
          $j=Get-Content dev309-request.json -Raw | ConvertFrom-Json
          $expected='https://raw.githubusercontent.com/danisuarezinef-ai/investment-intelligence-radar/ceo-update-channel/ceo-updates/DEV309_MANIFEST_UNSIGNED.json'
          if($j.manifest_url -ne $expected){throw 'wrong manifest url'}
          $log="$env:LOCALAPPDATA\CEO de IAs\diagnostics\DEV309_CLOSURE_CONVERGENCE_ACTIVACION.log"
          if(-not (Test-Path $log)){throw 'missing log'}
          $t=Get-Content $log -Raw
          if($t -notmatch 'DEV309 publicada y verificada'){throw 'success missing from log'}
          if($t -notmatch 'remote=1.5.85-rc1-closure-convergence'){throw 'remote visibility check missing'}
          if($t -notmatch 'CEO 1.5.84 localizado'){throw 'source version not detected'}
          Write-Host 'DEV309_SINGLE_ACTIVATOR_PASS'
