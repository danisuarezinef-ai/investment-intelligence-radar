name: Inspect DEV303 scheduler provider exception anchors compact

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev303-scheduler-provider-compact.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Compact anchors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp179
          mkdir -p tmp179
          unzip -q ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip -d tmp179
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp179/ceo_core/scheduler.py')
          lines=p.read_text().splitlines()
          for i,l in enumerate(lines,1):
              if any(k in l for k in ['provider_resilience','except Exception as exc','task.status = TaskStatus.RETRY','worker_recoveries','blocked_safe','provider.execute','router.select']):
                  print(f'--- {i} ---')
                  for j in range(max(1,i-12),min(len(lines),i+30)+1):
                      print(f'{j}: {lines[j-1]}')
          PY
