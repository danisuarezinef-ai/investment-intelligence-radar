name: Verify DEV303 stuck diagnostic

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev303-stuck-diagnostic.yml'
      - 'ceo-updates/DIAGNOSTICAR_ATASCADO_1_5_79.cmd'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start mock CEO
        shell: pwsh
        run: |
          @'
          import json
          from http.server import ThreadingHTTPServer,BaseHTTPRequestHandler
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def sendj(self,row,code=200):
                  b=json.dumps(row).encode()
                  self.send_response(code);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)
              def do_GET(self):
                  if self.path=='/api/health': return self.sendj({'ok':True,'version':'1.5.79-rc1-productive-resume-gate'})
                  return self.sendj({'endpoint':self.path,'ok':True})
          ThreadingHTTPServer(('127.0.0.1',8772),H).serve_forever()
          '@ | Set-Content -Encoding UTF8 mock.py
          Start-Process python -ArgumentList "mock.py" -WindowStyle Hidden
          Start-Sleep -Seconds 2
      - name: Run diagnostic
        shell: cmd
        run: |
          call ceo-updates\DIAGNOSTICAR_ATASCADO_1_5_79.cmd < nul
          if errorlevel 1 exit /b %errorlevel%
      - name: Verify output
        shell: pwsh
        run: |
          $f="$env:LOCALAPPDATA\CEO de IAs\diagnostics\CEO_DIAGNOSTICO_ATASCADO_1_5_79.json"
          if(-not (Test-Path $f)){throw "missing diagnostic"}
          $j=Get-Content $f -Raw | ConvertFrom-Json
          if([int]$j.port -ne 8772){throw "wrong port"}
          if([string]$j.health.version -ne '1.5.79-rc1-productive-resume-gate'){throw "wrong version"}
          if(-not $j.read_only){throw "read_only missing"}
          Write-Host "DEV303_STUCK_DIAGNOSTIC_PASS"
