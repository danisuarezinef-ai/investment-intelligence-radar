name: Inspect DEV303 signer startup dependency

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev303-signer-startup.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect publisher signer construction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp179
          mkdir -p tmp179
          unzip -q ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip -d tmp179
          echo '=== internal publisher ==='
          sed -n '1,360p' tmp179/ceo_core/internal_release_publisher.py
          echo '=== signing authority ==='
          sed -n '1,380p' tmp179/ceo_core/release_signing_authority.py
          echo '=== credential manager get ==='
          sed -n '70,175p' tmp179/ceo_core/credentials.py
          echo '=== CEOEngine init around release coordinator ==='
          sed -n '170,235p' tmp179/scripts/ceo_stdlib_work_mode.py
