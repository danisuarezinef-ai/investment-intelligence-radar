name: Inspect autonomous evidence mapping

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-autonomous-evidence-mapping.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect evidence engines
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp181
          mkdir -p tmp181
          unzip -q ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip -d tmp181
          echo '=== productive contract ==='
          cat tmp181/ceo_core/productive_task_contract_v1.py
          echo '=== deliverable evidence ==='
          cat tmp181/ceo_core/deliverable_evidence_engine_v1.py
          echo '=== scheduler calls ==='
          grep -nE 'productive_task_contract|deliverable_evidence|verification_application|independently_verified|acceptance_evidence' tmp181/ceo_core/scheduler.py
