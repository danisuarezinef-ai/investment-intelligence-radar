name: Build DEV304 Provider Resilience

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/build-dev304-provider-resilience.yml'
      - 'ceo-updates/build_dev304_provider_resilience.py'
      - 'ceo-updates/qualify_dev304_provider_resilience.py'

permissions:
  contents: write

jobs:
  build-test-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build candidate source tree
        shell: bash
        run: |
          set -euo pipefail
          python ceo-updates/build_dev304_provider_resilience.py

      - name: Install candidate dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -e /tmp/dev304

      - name: Compile candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dev304
          export PYTHONPATH="$PWD"
          python -m compileall -q .

      - name: Run inherited reliability gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dev304
          export PYTHONPATH="$PWD"
          python scripts/dev292_recovery_failclosed_qualification.py
          python scripts/dev294_internal_update_pipeline_qualification.py
          python scripts/dev295_update_confirm_qualification.py
          python scripts/security_audit.py

      - name: Run DEV304 field qualification
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/dev304 python ceo-updates/qualify_dev304_provider_resilience.py

      - name: Build deterministic candidate package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('/tmp/dev304')
          out=pathlib.Path('ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip')
          out.unlink(missing_ok=True)
          contract=json.loads((root/'CEO_UPDATE_PACKAGE.json').read_text(encoding='utf-8'))
          required=sorted(contract['required_paths'])
          fixed=(2026,9,20,20,15,0)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in required:
                  p=root/rel
                  assert p.is_file(),rel
                  info=zipfile.ZipInfo(rel,date_time=fixed)
                  info.create_system=0
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          data=out.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          size=len(data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(required)
          print('DEV304_SHA256='+sha)
          print('DEV304_SIZE='+str(size))
          PY

      - name: Generate prepared unsigned release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          u=pathlib.Path('ceo-updates')
          artifact='CEO_1.5.80-rc1-provider-resilience.zip'
          data=(u/artifact).read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          size=len(data)
          manifest={
            'artifact_name':artifact,
            'channel':'stable',
            'data_schema_version':1,
            'health_path':'/api/health',
            'launcher':'ABRIR_CEO.cmd',
            'manifest_version':2,
            'max_app_version':'',
            'min_app_version':'1.5.79-rc1-productive-resume-gate',
            'notes':'DEV304 Provider Resilience: pre-scheduler reliability migration, scheduler survives provider quota, WAITING_PROVIDER with zero recovery consumption, bounded automatic Gemini revalidation/resume, legacy-model exclusion, and explicit provider-wait observability.',
            'package_contract_version':1,
            'published_at':'2026-09-20T20:15:00Z',
            'release_id':'dev304-1.5.80-rc1-provider-resilience',
            'release_sequence':304,
            'release_status':'release',
            'sha256':sha,
            'signature_alg':'ed25519',
            'size_bytes':size,
            'url':'https://raw.githubusercontent.com/danisuarezinef-ai/investment-intelligence-radar/ceo-update-channel/ceo-updates/'+artifact,
            'version':'1.5.80-rc1-provider-resilience'
          }
          qualification={
            'candidate':'1.5.80-rc1-provider-resilience',
            'base':'1.5.79-rc1-productive-resume-gate',
            'release_sequence':304,
            'tests_passed':True,
            'security_passed':True,
            'pre_scheduler_migration_passed':True,
            'quota_wait_zero_recovery_passed':True,
            'scheduler_survives_provider_unavailable':True,
            'automatic_provider_revalidation_present':True,
            'provider_wait_observability_passed':True,
            'legacy_model_filter_passed':True,
            'windows_physical_verified':False,
            'production_ready':False,
            'operator_install_confirmation_required':True,
            'artifact':{'name':artifact,'sha256':sha,'size_bytes':size}
          }
          (u/'DEV304_MANIFEST_UNSIGNED.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (u/'DEV304_QUALIFICATION.json').write_text(json.dumps(qualification,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(qualification,indent=2))
          PY

      - name: Commit prepared candidate only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CEO Release Engineering"
          git config user.email "ceo-release@local.invalid"
          git add ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip ceo-updates/DEV304_MANIFEST_UNSIGNED.json ceo-updates/DEV304_QUALIFICATION.json
          git commit -m "Stage DEV304 provider resilience candidate"
          git push origin HEAD:ceo-update-channel
