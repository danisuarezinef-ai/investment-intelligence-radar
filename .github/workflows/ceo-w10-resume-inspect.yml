name: CEO W10 Resume Source Inspect

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - '.github/workflows/ceo-w10-resume-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
      - name: Inspect resume and worker lease code
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w10-inspect"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force
          Write-Host "W10_OPERATIONAL_RESILIENCE_BEGIN"
          Get-Content -Path (Join-Path $root "ceo_core\operational_resilience.py")
          Write-Host "W10_OPERATIONAL_RESILIENCE_END"
          Write-Host "W10_WORKER_LIFECYCLE_BEGIN"
          Get-Content -Path (Join-Path $root "ceo_core\worker_lifecycle_v2.py")
          Write-Host "W10_WORKER_LIFECYCLE_END"
