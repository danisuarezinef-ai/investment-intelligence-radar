name: Inspect result protocol exact

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-result-protocol-exact.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect protocol
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp181
          mkdir -p tmp181
          unzip -q ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip -d tmp181
          cat tmp181/ceo_core/result_protocol.py
          echo '=== controller ==='
          cat tmp181/ceo_core/conversation_controller.py
