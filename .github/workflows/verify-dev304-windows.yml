name: Verify DEV304 on Windows with 1.5.79 updater

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev304-windows.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract 1.5.79 updater and candidate
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tmp179,tmp180 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory tmp179 | Out-Null
          New-Item -ItemType Directory tmp180 | Out-Null
          Expand-Archive ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip tmp179
          Expand-Archive ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip tmp180
          python -m pip install --disable-pip-version-check -q -e .\tmp179

      - name: Stage and preflight DEV304 with 1.5.79 updater
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path .\tmp179).Path
          @'
          import dataclasses,json,pathlib,tempfile,time,sys,hashlib
          from ceo_core.in_app_updater import InAppUpdater,UpdateManifest
          repo=pathlib.Path.cwd()
          manifest=json.loads((repo/'ceo-updates/DEV304_MANIFEST_UNSIGNED.json').read_text(encoding='utf-8'))
          artifact=repo/'ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip'
          data=artifact.read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['sha256']
          assert len(data)==manifest['size_bytes']
          manifest['url']=artifact.resolve().as_uri()
          allowed={f.name for f in dataclasses.fields(UpdateManifest)}
          m=UpdateManifest(**{k:v for k,v in manifest.items() if k in allowed})
          with tempfile.TemporaryDirectory(prefix='ceo-dev304-win-') as td:
              u=InAppUpdater(data_root=td)
              t=time.perf_counter()
              row=u.stage(m)
              stage_s=time.perf_counter()-t
              assert row['version']=='1.5.80-rc1-provider-resilience'
              assert row.get('contract_verified') is True,row
              assert u.progress().get('phase')=='ready_to_install',u.progress()
              t=time.perf_counter()
              pre=u.preflight_staged(row['version'],python_executable=sys.executable,timeout=60)
              pre_s=time.perf_counter()-t
              assert pre.get('ok') is True,pre
              print(json.dumps({
                  'windows_stage_pass':True,
                  'windows_preflight_pass':True,
                  'stage_seconds':stage_s,
                  'preflight_seconds':pre_s,
                  'version':row['version'],
                  'contract_verified':row.get('contract_verified'),
                  'file_count':row.get('file_count'),
                  'preflight':pre,
              },indent=2,default=str))
          '@ | Set-Content -Encoding UTF8 .\verify304.py
          python .\verify304.py

      - name: Windows import and provider semantics smoke
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path .\tmp180).Path
          @'
          import pathlib,sys,time
          from ceo_core.provider_resilience_v2 import ProviderResilienceV2
          from ceo_core.scheduler import RELIABILITY_EPOCH
          from ceo_core.providers.gemini_interactions import GeminiInteractionsTransport
          r=ProviderResilienceV2()
          q=r.classify('HTTP 429 RESOURCE_EXHAUSTED quota',1)
          assert q.category=='quota' and q.retry_after_seconds>=300 and not q.spending_allowed,q
          assert RELIABILITY_EPOCH=='dev304-provider-resilience-v1',RELIABILITY_EPOCH
          assert 'gemini-2.5-flash' in GeminiInteractionsTransport.KNOWN_UNAVAILABLE_MODELS
          assert 'gemini-2.5-flash-lite' in GeminiInteractionsTransport.KNOWN_UNAVAILABLE_MODELS
          print('DEV304_WINDOWS_PROVIDER_SEMANTICS_PASS')
          '@ | Set-Content -Encoding UTF8 .\smoke304.py
          python .\smoke304.py
