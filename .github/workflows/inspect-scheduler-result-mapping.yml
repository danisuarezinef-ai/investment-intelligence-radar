name: Inspect scheduler result evidence mapping

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-scheduler-result-mapping.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect result mapping
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp181
          mkdir -p tmp181
          unzip -q ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip -d tmp181
          grep -nE 'result\.artifacts|result\.metadata|task\.metadata\["artifacts"|task\.result = result\.text|WorkerResult' tmp181/ceo_core/scheduler.py
          echo '=== context ==='
          python - <<'PY'
          from pathlib import Path
          lines=Path('tmp181/ceo_core/scheduler.py').read_text().splitlines()
          for i,l in enumerate(lines,1):
              if 'result.artifacts' in l or 'result.metadata' in l or 'task.result = result.text' in l:
                  for j in range(max(1,i-25),min(len(lines),i+70)+1):
                      print(f'{j}: {lines[j-1]}')
                  print('---')
          PY
