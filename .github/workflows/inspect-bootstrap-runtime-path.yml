name: Inspect Bootstrap Gate runtime path

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-bootstrap-runtime-path.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect exact runtime path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp181
          mkdir -p tmp181
          unzip -q ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip -d tmp181
          echo '=== start_project ==='
          sed -n '300,500p' tmp181/scripts/ceo_stdlib_work_mode.py
          echo '=== engine init/router ==='
          sed -n '160,360p' tmp181/scripts/ceo_stdlib_work_mode.py
          echo '=== mock provider ==='
          cat tmp181/ceo_core/providers/mock.py
          echo '=== productive smoke gate ==='
          cat tmp181/ceo_core/productive_smoke_gate_v1.py
          echo '=== scheduler constructor + start/loop ==='
          sed -n '200,460p' tmp181/ceo_core/scheduler.py
          echo '=== completion references ==='
          grep -RInE 'completed_at =|goal_audit_passed|goal_deliverables|deliverable|mark.*complete|project.*complete|all.*complete' tmp181/ceo_core/scheduler.py tmp181/ceo_core/autonomous_loop.py tmp181/ceo_core/graph.py | head -n 900
