name: CEO W11 Local Idempotency Audit

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - 'ceo-browser/apply_w11_local_idempotency.py'
      - 'ceo-browser/w11_local_idempotency_regression.py'
      - '.github/workflows/ceo-w11-local-idempotency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w11:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3" psutil httpx
      - name: Build cumulative W6-W10 candidate and reproduce W11 bug
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w11-raw"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force
          $env:CEO_W6_ROOT=$root
          $env:CEO_W7_ROOT=$root
          $env:CEO_W8_ROOT=$root
          $env:CEO_W9_ROOT=$root
          $env:CEO_W10_ROOT=$root
          python ceo-browser\apply_w6_completion_persistence.py
          python ceo-browser\apply_w7_recovery_lineage_cap.py
          python ceo-browser\apply_w8_productivity_truth_fix.py
          python ceo-browser\apply_w9_local_finite_task.py
          python ceo-browser\apply_w10_restart_lease_fix.py
          if($LASTEXITCODE -ne 0){throw "W11 raw cumulative build failed"}
          $env:CEO_W11_ROOT=$root
          $env:CEO_W11_EXPECT_RAW_BUG='1'
          python ceo-browser\w11_local_idempotency_regression.py
          if($LASTEXITCODE -ne 0){throw "W11 raw reproduction failed"}
          Remove-Item Env:CEO_W11_EXPECT_RAW_BUG
      - name: Apply W11 and prove idempotent replay
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w11-patched"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force
          $env:CEO_W6_ROOT=$root
          $env:CEO_W7_ROOT=$root
          $env:CEO_W8_ROOT=$root
          $env:CEO_W9_ROOT=$root
          $env:CEO_W10_ROOT=$root
          $env:CEO_W11_ROOT=$root
          python ceo-browser\apply_w6_completion_persistence.py
          python ceo-browser\apply_w7_recovery_lineage_cap.py
          python ceo-browser\apply_w8_productivity_truth_fix.py
          python ceo-browser\apply_w9_local_finite_task.py
          python ceo-browser\apply_w10_restart_lease_fix.py
          python ceo-browser\apply_w11_local_idempotency.py
          if($LASTEXITCODE -ne 0){throw "W11 patch failed"}
          python ceo-browser\w11_local_idempotency_regression.py
          if($LASTEXITCODE -ne 0){throw "W11 regression failed"}
          python -m compileall -q $root
          if($LASTEXITCODE -ne 0){throw "W11 candidate compile failed"}
          Write-Host "W11_WINDOWS_CI_PASS"
