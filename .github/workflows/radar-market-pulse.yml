name: Radar Market Pulse

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/radar-market-pulse.yml"

permissions:
  contents: read

concurrency:
  group: radar-market-pulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: https://wvmiludqzdepqmjhfwos.supabase.co
      SUPABASE_ANON_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2bWlsdWRxemRlcHFtamhmd29zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTU3MDYsImV4cCI6MjEwNDM5MTcwNn0.R1Sa1tqBeQT4cyunGlHqVaKqeq4aNomaAlUfCGyEXzw
    steps:
      - name: Invoke PAPER-safe market collector
        shell: bash
        run: |
          set -euo pipefail
          out="$(curl --fail-with-body --retry 2 --retry-delay 2 --max-time 120 -sS \
            -X POST "$SUPABASE_URL/functions/v1/radar-market-pulse" \
            -H "Authorization: Bearer $SUPABASE_ANON_JWT" \
            -H "apikey: $SUPABASE_ANON_JWT" \
            -H "Content-Type: application/json" \
            --data '{"source":"github-actions","real_trading":false}')"
          printf '%s\n' "$out"
          RESPONSE="$out" python - <<'PY'
          import json, os
          row=json.loads(os.environ["RESPONSE"])
          assert row.get("ok") is True, row
          assert row.get("real_trading") is False, row
          assert row.get("status") in {"PULSE_OK","PULSE_PARTIAL","SKIPPED_RATE_LIMIT"}, row
          PY
