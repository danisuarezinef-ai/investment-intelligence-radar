name: Inspect DEV304 goal audit recycle exact

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev304-goal-audit-recycle.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect recycle method
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp180
          mkdir -p tmp180
          unzip -q ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip -d tmp180
          grep -n "def _recycle_terminal_goal_audit" tmp180/ceo_core/autonomous_loop.py
          start=$(grep -n "def _recycle_terminal_goal_audit" tmp180/ceo_core/autonomous_loop.py | head -1 | cut -d: -f1)
          end=$((start+130))
          sed -n "${start},${end}p" tmp180/ceo_core/autonomous_loop.py
