name: Block E Market Data CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [block-e-market-data]
permissions:
  contents: read
jobs:
  block-e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Block E runtime
        run: |
          python -m py_compile radar_block_e_market_data_v1.py radar_block_e_external_fallback_v1.py cloud_service_v32.py cloud_service_v33.py
      - name: Verify PAPER safety boundary
        run: |
          python - <<'PY'
          import radar_block_e_market_data_v1 as e
          import radar_block_e_external_fallback_v1 as f
          import cloud_service_v32 as v32
          import cloud_service_v33 as v33
          for mod in (e,f,v32,v33): assert mod.REAL_TRADING is False
          out=e.deterministic_block_e_validation()
          assert out['status']=='PASS', out
          assert out['real_trading'] is False
          PY
      - name: Run Block E tests
        run: |
          set +e
          python -m pytest -vv tests/test_block_e_market_data.py tests/test_market.py > block-e-test-output.txt 2>&1
          code=$?
          cat block-e-test-output.txt
          exit $code
      - name: Upload Block E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-e-test-output
          path: block-e-test-output.txt
          if-no-files-found: error
