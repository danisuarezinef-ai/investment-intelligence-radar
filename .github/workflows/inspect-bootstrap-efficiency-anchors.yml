name: Inspect Bootstrap efficiency patch anchors

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-bootstrap-efficiency-anchors.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect roles, verification scheduling and goal lock
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp181
          mkdir -p tmp181
          unzip -q ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip -d tmp181

          echo '=== task roles ==='
          cat tmp181/ceo_core/task_roles_v2.py

          echo '=== scheduler verification method ==='
          sed -n '1425,1485p' tmp181/ceo_core/scheduler.py

          echo '=== goal engine ==='
          grep -RInE '^class GoalEngine|def lock\(' tmp181/ceo_core tmp181/scripts --include='*.py' | head -n 100
          for f in tmp181/ceo_core/*.py; do
            if grep -q '^class GoalEngine' "$f"; then echo "FILE $f"; sed -n '1,280p' "$f"; fi
          done
