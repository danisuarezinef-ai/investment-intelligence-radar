name: Inspect exact DEV310 updater and launcher

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev310-updater-launcher.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Extract exact 1.5.86 updater/launcher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dev310-exact ceo-updates/dev310-inspect
          mkdir -p /tmp/dev310-exact ceo-updates/dev310-inspect
          unzip -q ceo-updates/CEO_1.5.86-rc1-provider-session-integrity.zip -d /tmp/dev310-exact
          for f in             scripts/ceo_stdlib_work_mode.py             scripts/relaunch_after_update.py             scripts/install_windows_bootstrap.py             scripts/launch_current.py             ceo_core/in_app_updater.py             ceo_core/windows_shell.py             ABRIR_CEO.cmd; do
            cp "/tmp/dev310-exact/$f" "ceo-updates/dev310-inspect/$(basename "$f")"
          done
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "CEO Reliability Engineering"
          git config user.email "ceo-reliability@local.invalid"
          git add ceo-updates/dev310-inspect
          git commit -m "Snapshot exact DEV310 updater and launcher runtime"
          git push origin HEAD:ceo-update-channel
