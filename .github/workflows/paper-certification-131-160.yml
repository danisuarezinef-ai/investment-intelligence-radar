name: PAPER Certification 121-190
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  paper-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Safety boundary and imports
        run: |
          python - <<'PY'
          import cloud_service_v24 as v24
          import radar_learning_governance_121_130_v2 as g
          import radar_paper_certification_131_160_v1 as c
          import radar_operational_proof_161_170_v1 as p
          import radar_execution_reality_171_190_v1 as x
          assert v24.REAL_TRADING is False
          for mod in (g,c,p,x): assert mod.REAL_TRADING is False
          for b in (c.board(),p.board(),x.board()):
              assert b['real_trading'] is False
              assert b['live_execution_allowed'] is False
              assert b['automatic_promotion'] is False
              assert b['automatic_release'] is False
          PY
      - name: Run governance certification and operational proof tests
        run: |
          python -m pytest -q \
            tests/test_learning_governance_121_130_v1.py \
            tests/test_paper_certification_131_160_v1.py \
            tests/test_operational_proof_161_170_v1.py \
            tests/test_execution_reality_171_190_v1.py
      - name: Verify runtime chain and entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          for n in range(10,25): assert Path(f'cloud_service_v{n}.py').exists(), n
          start=Path('start.sh').read_text(encoding='utf-8')
          assert 'exec python cloud_service_v24.py' in start
          for n in range(10,25):
              text=Path(f'cloud_service_v{n}.py').read_text(encoding='utf-8')
              assert 'REAL_TRADING=False' in text.replace(' ','')
          PY
      - name: Verify execution reality schema migration
        run: |
          grep -q 'radar_market_quote_observations' supabase/migrations/20260914081000_paper_execution_reality_171_190.sql
          grep -q 'paper_maturity_no_overlap' supabase/migrations/20260914081000_paper_execution_reality_171_190.sql
