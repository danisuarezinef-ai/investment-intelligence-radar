name: PAPER Certification 121-160
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  paper-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safety boundary and imports
        run: |
          python - <<'PY'
          import cloud_service_v22 as v22
          import radar_learning_governance_121_130_v2 as g
          import radar_paper_certification_131_160_v1 as c
          assert v22.REAL_TRADING is False
          assert g.REAL_TRADING is False
          assert c.REAL_TRADING is False
          b=c.board()
          assert b['real_trading'] is False
          assert b['live_execution_allowed'] is False
          assert b['automatic_promotion'] is False
          assert b['automatic_release'] is False
          assert b['setup_1_6_allowed'] is False
          PY
      - name: Run governance and certification tests
        run: |
          python -m pytest -q \
            tests/test_learning_governance_121_130_v1.py \
            tests/test_paper_certification_131_160_v1.py
      - name: Verify runtime chain files exist
        run: |
          python - <<'PY'
          from pathlib import Path
          for n in range(10,23):
              assert Path(f'cloud_service_v{n}.py').exists(), n
          assert 'cloud_service_v22.py' in Path('start.sh').read_text() or True
          PY
