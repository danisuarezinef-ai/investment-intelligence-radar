name: Inspect DEV304 99pct no-executable-route

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev304-99pct-route.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect watchdog, graph, provider wait and completion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp180
          mkdir -p tmp180
          unzip -q ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip -d tmp180
          echo '=== watchdog ==='
          cat tmp180/ceo_core/useful_output_watchdog_v2.py
          echo '=== graph ==='
          cat tmp180/ceo_core/graph.py
          echo '=== scheduler liveness/completion ==='
          grep -nE 'no executable|route executable|provider_wait|WAITING_PROVIDER|goal_audit|99|depth_percent|completed_at|final audit|BLOCKED' tmp180/ceo_core/scheduler.py tmp180/ceo_core/autonomous_loop.py tmp180/ceo_core/productive_truth_v2.py tmp180/scripts/ceo_stdlib_work_mode.py | head -n 2200 || true
          echo '=== task statuses ==='
          sed -n '1,160p' tmp180/ceo_core/models.py
