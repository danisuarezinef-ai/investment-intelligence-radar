name: Verify DEV304 internal release trigger

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev304-trigger.yml'
      - 'ceo-updates/ACTIVAR_DEV304_DESDE_CEO.cmd'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start mock CEO 1.5.79
        shell: pwsh
        run: |
          @'
          import json
          from http.server import ThreadingHTTPServer,BaseHTTPRequestHandler
          from pathlib import Path
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def sendj(self,row,code=200):
                  b=json.dumps(row).encode()
                  self.send_response(code);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)
              def do_GET(self):
                  if self.path=='/api/health':
                      return self.sendj({'ok':True,'version':'1.5.79-rc1-productive-resume-gate'})
                  return self.sendj({'error':'not_found'},404)
              def do_POST(self):
                  n=int(self.headers.get('Content-Length') or 0)
                  body=self.rfile.read(n)
                  Path('dev304-trigger-request.json').write_bytes(body)
                  if self.path=='/api/internal-release/activate-prepared':
                      return self.sendj({'ok':True,'status':'PUBLISHED','version':'1.5.80-rc1-provider-resilience','remote_verified':True})
                  return self.sendj({'error':'not_found'},404)
          ThreadingHTTPServer(('127.0.0.1',8775),H).serve_forever()
          '@ | Set-Content -Encoding UTF8 mock304.py
          Start-Process python -ArgumentList "mock304.py" -WindowStyle Hidden
          Start-Sleep -Seconds 2

      - name: Run trigger
        shell: cmd
        env:
          CEO_TRIGGER_NO_BROWSER: "1"
        run: |
          call ceo-updates\ACTIVAR_DEV304_DESDE_CEO.cmd < nul
          if errorlevel 1 exit /b %errorlevel%

      - name: Validate request
        shell: pwsh
        run: |
          $j=Get-Content dev304-trigger-request.json | ConvertFrom-Json
          $expected='https://raw.githubusercontent.com/danisuarezinef-ai/investment-intelligence-radar/ceo-update-channel/ceo-updates/DEV304_MANIFEST_UNSIGNED.json'
          if($j.manifest_url -ne $expected){throw "wrong manifest URL"}
          Write-Host "DEV304_INTERNAL_TRIGGER_PASS"
