name: Verify DEV302 transition activator

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev302-transition.yml'
      - 'ceo-updates/DEV302_COMPLETE_TRANSITION.py'
      - 'ceo-updates/COMPLETAR_ACTUALIZACION_MAYOR_1_5_78.cmd'
      - 'ceo-updates/DEV302_MANIFEST_UNSIGNED.json'
      - 'ceo-updates/CEO_1.5.78-rc1-reliable-update-handoff.zip'

permissions:
  contents: read

jobs:
  verify-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static activator checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ceo-updates/DEV302_COMPLETE_TRANSITION.py
          python - <<'PY'
          import ast,hashlib,json,pathlib,re
          u=pathlib.Path('ceo-updates')
          helper=(u/'DEV302_COMPLETE_TRANSITION.py').read_text(encoding='utf-8')
          cmd=(u/'COMPLETAR_ACTUALIZACION_MAYOR_1_5_78.cmd').read_text(encoding='utf-8')
          m=json.loads((u/'DEV302_MANIFEST_UNSIGNED.json').read_text(encoding='utf-8'))
          assert m['version']=='1.5.78-rc1-reliable-update-handoff'
          assert m['release_sequence']==302
          assert m['sha256']=='4b7fa43511c824e5fa45039480721f604b1e5ef520cfda86a7a9d1f25c02ddbc'
          assert m['size_bytes']==1136520
          for token in [
              'DEV302_PUBLISHED_AND_STAGED','install_resilient_atomic_writer',
              'operator_install_confirmation_required','previous_rejection_preserved_for_audit'
          ]: assert token in helper,token
          for token in [
              '1.5.78 PUBLICADA Y PREPARADA PARA INSTALAR',
              'Instalar y reiniciar','NO instala sin tu confirmacion',
              'DEV302_COMPLETE_TRANSITION.py'
          ]: assert token in cmd,token
          assert 'DEV295' not in helper and 'DEV295' not in cmd
          labels=set(re.findall(r'(?m)^:([A-Za-z0-9_]+)\s*$',cmd))
          gotos=re.findall(r'(?i)\bgoto\s+([A-Za-z0-9_]+)',cmd)
          assert all(g.upper() in {x.upper() for x in labels} for g in gotos)
          print({
            'helper_sha256':hashlib.sha256(helper.encode()).hexdigest(),
            'launcher_sha256':hashlib.sha256(cmd.encode()).hexdigest(),
            'labels':sorted(labels),'status':'PASS'
          })
          PY
      - name: Fail closed outside Windows
        shell: bash
        run: |
          set +e
          python ceo-updates/DEV302_COMPLETE_TRANSITION.py >/tmp/out 2>&1
          rc=$?
          set -e
          cat /tmp/out
          test "$rc" -eq 6
          grep -q '"status": "WINDOWS_REQUIRED"' /tmp/out
          grep -q '"installed": false' /tmp/out

  stage-on-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract active 1.5.58 updater and install dependencies
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tmp1558 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory tmp1558 | Out-Null
          Expand-Archive ceo-updates/CEO_1.5.58-rc1-productive-stall-escape.zip tmp1558
          python -m pip install --disable-pip-version-check -q -e .\tmp1558
      - name: Stage 1.5.78 using exact 1.5.58 updater
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path .\tmp1558).Path
          @'
          import dataclasses,json,pathlib,tempfile,time
          from ceo_core.in_app_updater import InAppUpdater,UpdateManifest
          repo=pathlib.Path.cwd()
          p=json.loads((repo/'ceo-updates/DEV302_MANIFEST_UNSIGNED.json').read_text(encoding='utf-8'))
          p['url']=(repo/'ceo-updates/CEO_1.5.78-rc1-reliable-update-handoff.zip').resolve().as_uri()
          allowed={f.name for f in dataclasses.fields(UpdateManifest)}
          m=UpdateManifest(**{k:v for k,v in p.items() if k in allowed})
          with tempfile.TemporaryDirectory() as td:
              u=InAppUpdater(data_root=td)
              t=time.perf_counter()
              row=u.stage(m)
              elapsed=time.perf_counter()-t
              progress=u.progress()
              print(json.dumps({'elapsed':elapsed,'progress':progress,'version':row.get('version'),'contract_verified':row.get('contract_verified'),'file_count':row.get('file_count')},indent=2,default=str))
              assert row['version']=='1.5.78-rc1-reliable-update-handoff'
              assert row.get('contract_verified') is True
              assert progress.get('phase')=='ready_to_install'
              assert elapsed < 30
          '@ | Set-Content -Encoding UTF8 .\stage302.py
          python .\stage302.py
