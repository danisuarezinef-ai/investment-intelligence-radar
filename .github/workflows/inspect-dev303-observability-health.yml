name: Inspect DEV303 observability health mapping

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev303-observability-health.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Observability health
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp179
          mkdir -p tmp179
          unzip -q ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip -d tmp179
          grep -nE 'productive_truth|health_level|level =|stalled|planning|working|attention' tmp179/ceo_core/observability.py | head -n 220
          sed -n '80,155p' tmp179/ceo_core/observability.py
