name: Inspect 1.5.82 recovery storm task keys

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-1582-recovery-task-keys.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Show recovery storm guard
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp182
          mkdir -p tmp182
          unzip -q ceo-updates/CEO_1.5.82-rc1-autonomy-bootstrap.zip -d tmp182
          cat tmp182/ceo_core/recovery_storm_guard_v1.py
