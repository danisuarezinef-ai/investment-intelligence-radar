name: CEO W12 Pause Resume Cancel

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - 'ceo-browser/apply_w12_operator_control.py'
      - 'ceo-browser/w12_pause_resume_cancel_regression.py'
      - '.github/workflows/ceo-w12-pause-resume-cancel.yml'

permissions:
  contents: read

jobs:
  w12:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CEO_ALLOW_OPTIONAL_API: '0'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      PERPLEXITY_API_KEY: ''
      XAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3" psutil httpx
      - name: Reproduce raw W12 pause and resume failures
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w12"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force
          $env:CEO_W6_ROOT=$root
          $env:CEO_W7_ROOT=$root
          $env:CEO_W8_ROOT=$root
          $env:CEO_W9_ROOT=$root
          $env:CEO_W10_ROOT=$root
          $env:CEO_W11_ROOT=$root
          $env:CEO_W12_ROOT=$root
          python ceo-browser\apply_w6_completion_persistence.py
          python ceo-browser\apply_w7_recovery_lineage_cap.py
          python ceo-browser\apply_w8_productivity_truth_fix.py
          python ceo-browser\apply_w9_local_finite_task.py
          python ceo-browser\apply_w10_restart_lease_fix.py
          python ceo-browser\apply_w11_local_idempotency.py
          $env:CEO_W12_EXPECT_RAW_BUG='1'
          python ceo-browser\w12_pause_resume_cancel_regression.py
          if($LASTEXITCODE -ne 0){throw "W12 raw regression failed to reproduce bugs"}
          Remove-Item Env:CEO_W12_EXPECT_RAW_BUG
      - name: Apply W12 and prove durable operator controls
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w12"
          $env:CEO_W12_ROOT=$root
          python ceo-browser\apply_w12_operator_control.py
          if($LASTEXITCODE -ne 0){throw "W12 operator control patch failed"}
          python ceo-browser\w12_pause_resume_cancel_regression.py
          if($LASTEXITCODE -ne 0){throw "W12 pause resume cancel regression failed"}
          python -m compileall -q $root
          if($LASTEXITCODE -ne 0){throw "W12 cumulative candidate compile failed"}
          Write-Host "W12_WINDOWS_CI_PASS"
