name: Build DEV307 Autonomy Invariants

on:
  push:
    branches:
      - ceo-update-channel
    paths:
      - ".github/workflows/build-dev307-autonomy-invariants.yml"
      - "ceo-updates/build_dev307_autonomy_invariants.py"
      - "ceo-updates/dev307_invariant_regression.py"

permissions:
  contents: write

jobs:
  build-qualify-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DEV307 candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ceo-dev307"
          $env:CEO_DEV307_BUILD_ROOT = $root
          python ceo-updates\build_dev307_autonomy_invariants.py
          if ($LASTEXITCODE -ne 0) { throw "candidate build failed" }
          python -m pip install --disable-pip-version-check -q -e $root
          if ($LASTEXITCODE -ne 0) { throw "candidate install failed" }
          "CEO_GATE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_NO_BROWSER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LOCALAPPDATA=$(Join-Path $env:RUNNER_TEMP 'ceo-dev307-localappdata')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APPDATA=$(Join-Path $env:RUNNER_TEMP 'ceo-dev307-appdata')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_GATE_ARTIFACTS=$(Join-Path $env:RUNNER_TEMP 'ceo-dev307-artifacts')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile and inherited reliability gates
        shell: pwsh
        run: |
          Push-Location $env:CEO_GATE_ROOT
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          python scripts\dev292_recovery_failclosed_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV292 failed" }
          python scripts\dev294_internal_update_pipeline_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV294 failed" }
          python scripts\dev295_update_confirm_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV295 failed" }
          python scripts\security_audit.py
          if ($LASTEXITCODE -ne 0) { throw "security audit failed" }
          Pop-Location

      - name: DEV307 invariant regression
        shell: pwsh
        run: |
          python ceo-updates\dev307_invariant_regression.py
          if ($LASTEXITCODE -ne 0) { throw "DEV307 invariant regression failed" }

      - name: Prepare ABG dirs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CEO_GATE_ARTIFACTS | Out-Null

      - name: Same Autonomy Bootstrap Gates 1-6
        shell: pwsh
        run: |
          python ceo-updates\autonomy_bootstrap_gate_v1.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 1 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v2.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 2 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v3.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 3 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v4.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 4 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v5.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 5 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v6.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 6 failed" }

      - name: Package deterministic DEV307 candidate
        shell: pwsh
        run: |
          @'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['CEO_GATE_ROOT'])
          outdir=pathlib.Path('ceo-updates')
          version='1.5.83-rc1-autonomy-invariants'
          artifact=f'CEO_{version}.zip'
          out=outdir/artifact
          out.unlink(missing_ok=True)
          contract=json.loads((root/'CEO_UPDATE_PACKAGE.json').read_text(encoding='utf-8'))
          assert contract['app_version']==version,contract['app_version']
          required=sorted(contract['required_paths'])
          fixed=(2026,9,20,22,35,0)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in required:
                  p=root/rel
                  assert p.is_file(),rel
                  info=zipfile.ZipInfo(rel,date_time=fixed)
                  info.create_system=0
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          data=out.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          size=len(data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(required)

          manifest={
              'artifact_name':artifact,
              'channel':'stable',
              'data_schema_version':1,
              'health_path':'/api/health',
              'launcher':'ABRIR_CEO.cmd',
              'manifest_version':2,
              'max_app_version':'',
              'min_app_version':'1.5.82-rc1-autonomy-bootstrap',
              'notes':'DEV307 Autonomy Invariants: finished worker futures cannot leave durable RUNNING tasks or consume false recovery budget; quality-repair lineages are bounded across replacement task IDs. No new features.',
              'package_contract_version':1,
              'published_at':'2026-09-20T22:35:00Z',
              'release_id':'dev307-1.5.83-rc1-autonomy-invariants',
              'release_sequence':307,
              'release_status':'candidate',
              'sha256':sha,
              'signature_alg':'ed25519',
              'size_bytes':size,
              'url':f'https://raw.githubusercontent.com/danisuarezinef-ai/investment-intelligence-radar/ceo-update-channel/ceo-updates/{artifact}',
              'version':version
          }
          qualification={
              'candidate':version,
              'base':'1.5.82-rc1-autonomy-bootstrap',
              'release_sequence':307,
              'tests_passed':True,
              'security_passed':True,
              'invariant_finished_future_no_durable_running':True,
              'invariant_quality_repair_lineage_bounded':True,
              'same_abg_1_end_to_end':True,
              'same_abg_2_consecutive_goals':True,
              'same_abg_3_restart_resume':True,
              'same_abg_4_provider_outage_resume':True,
              'same_abg_5_efficiency':True,
              'same_abg_6_self_development_sandbox':True,
              'production_ready':False,
              'field_validation_pending':True,
              'operator_install_confirmation_required':True,
              'artifact':{'name':artifact,'sha256':sha,'size_bytes':size,'entries':len(required)}
          }
          (outdir/'DEV307_MANIFEST_UNSIGNED.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (outdir/'DEV307_QUALIFICATION.json').write_text(json.dumps(qualification,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(qualification,indent=2))
          '@ | Set-Content -Encoding UTF8 package307.py
          python package307.py
          if ($LASTEXITCODE -ne 0) { throw "package failed" }

      - name: Commit prepared DEV307 candidate
        shell: pwsh
        run: |
          git config user.name "CEO Release Engineering"
          git config user.email "ceo-release@local.invalid"
          git add ceo-updates/CEO_1.5.83-rc1-autonomy-invariants.zip ceo-updates/DEV307_MANIFEST_UNSIGNED.json ceo-updates/DEV307_QUALIFICATION.json
          git commit -m "Stage DEV307 autonomy invariants candidate"
          git push origin HEAD:ceo-update-channel
