name: Build DEV308 Executable Route Integrity

on:
  push:
    branches:
      - ceo-update-channel
    paths:
      - ".github/workflows/build-dev308-executable-route-integrity.yml"
      - "ceo-updates/build_dev308_executable_route_integrity.py"
      - "ceo-updates/qualify_dev308_executable_route_integrity.py"

permissions:
  contents: write

jobs:
  build-qualify-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DEV308 candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ceo-dev308"
          $env:CEO_DEV308_BUILD_ROOT = $root
          python ceo-updates\build_dev308_executable_route_integrity.py
          if ($LASTEXITCODE -ne 0) { throw "DEV308 build failed" }

          python -m pip install --disable-pip-version-check -q -e $root
          if ($LASTEXITCODE -ne 0) { throw "DEV308 install failed" }

          "CEO_DEV308_BUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_GATE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_NO_BROWSER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LOCALAPPDATA=$(Join-Path $env:RUNNER_TEMP 'ceo-dev308-localappdata')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APPDATA=$(Join-Path $env:RUNNER_TEMP 'ceo-dev308-appdata')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_GATE_ARTIFACTS=$(Join-Path $env:RUNNER_TEMP 'ceo-dev308-artifacts')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile and inherited reliability qualification
        shell: pwsh
        run: |
          Push-Location $env:CEO_DEV308_BUILD_ROOT
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }

          python scripts\dev292_recovery_failclosed_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV292 failed" }

          python scripts\dev294_internal_update_pipeline_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV294 failed" }

          python scripts\dev295_update_confirm_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV295 failed" }

          python scripts\security_audit.py
          if ($LASTEXITCODE -ne 0) { throw "security audit failed" }
          Pop-Location

      - name: DEV308 exact field-shape regression
        shell: pwsh
        run: |
          python ceo-updates\qualify_dev308_executable_route_integrity.py
          if ($LASTEXITCODE -ne 0) { throw "DEV308 route-integrity qualification failed" }

      - name: Prepare ABG directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CEO_GATE_ARTIFACTS | Out-Null

      - name: Re-run identical Autonomy Bootstrap Gates 1-6
        shell: pwsh
        run: |
          python ceo-updates\autonomy_bootstrap_gate_v1.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 1 failed" }

          python ceo-updates\autonomy_bootstrap_gate_v2.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 2 failed" }

          python ceo-updates\autonomy_bootstrap_gate_v3.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 3 failed" }

          python ceo-updates\autonomy_bootstrap_gate_v4.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 4 failed" }

          python ceo-updates\autonomy_bootstrap_gate_v5.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 5 failed" }

          python ceo-updates\autonomy_bootstrap_gate_v6.py
          if ($LASTEXITCODE -ne 0) { throw "ABG 6 failed" }

      - name: Package deterministic DEV308 candidate
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, pathlib, zipfile

          root = pathlib.Path(os.environ["CEO_DEV308_BUILD_ROOT"])
          outdir = pathlib.Path("ceo-updates")
          version = "1.5.84-rc1-executable-route-integrity"
          artifact = f"CEO_{version}.zip"
          out = outdir / artifact
          out.unlink(missing_ok=True)

          contract = json.loads((root / "CEO_UPDATE_PACKAGE.json").read_text(encoding="utf-8"))
          assert contract["app_version"] == version, contract["app_version"]
          required = sorted(contract["required_paths"])
          fixed = (2026, 9, 21, 0, 55, 0)

          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for rel in required:
                  p = root / rel
                  assert p.is_file(), rel
                  info = zipfile.ZipInfo(rel, date_time=fixed)
                  info.create_system = 0
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0
                  z.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          data = out.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          size = len(data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == set(required)

          manifest = {
              "artifact_name": artifact,
              "channel": "stable",
              "data_schema_version": 1,
              "health_path": "/api/health",
              "launcher": "ABRIR_CEO.cmd",
              "manifest_version": 2,
              "max_app_version": "",
              "min_app_version": "1.5.83-rc1-autonomy-runtime-integrity",
              "notes": (
                  "DEV308 Executable Route Integrity: productive READY/RETRY work cannot be "
                  "classified as a global stall solely from recovery history; a closed recovery "
                  "fuse clears its owned suppression; active/executable work overrides stale "
                  "blocked operator state; detailed single-file goals use compact decomposition. "
                  "Protected safety and human gates remain fail-closed."
              ),
              "package_contract_version": 1,
              "published_at": "2026-09-21T00:55:00Z",
              "release_id": "dev308-1.5.84-rc1-executable-route-integrity",
              "release_sequence": 308,
              "release_status": "release",
              "sha256": sha,
              "signature_alg": "ed25519",
              "size_bytes": size,
              "url": (
                  "https://raw.githubusercontent.com/danisuarezinef-ai/"
                  "investment-intelligence-radar/ceo-update-channel/ceo-updates/" + artifact
              ),
              "version": version,
          }

          qualification = {
              "candidate": version,
              "base": "1.5.83-rc1-autonomy-runtime-integrity",
              "release_sequence": 308,
              "tests_passed": True,
              "security_passed": True,
              "field_shape_73pct_8recoveries_regression": True,
              "productive_ready_is_executable_route": True,
              "closed_fuse_clears_owned_suppression": True,
              "executable_route_precedes_stale_blocked_state": True,
              "detailed_single_file_goal_compact": True,
              "protected_blocks_preserved": True,
              "autonomy_bootstrap_gates_1_6_repassed": True,
              "windows_stage_preflight_passed": False,
              "field_validation_pending": True,
              "production_ready": False,
              "operator_install_confirmation_required": True,
              "artifact": {
                  "name": artifact,
                  "sha256": sha,
                  "size_bytes": size,
                  "entries": len(required),
              },
          }

          (outdir / "DEV308_MANIFEST_UNSIGNED.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (outdir / "DEV308_QUALIFICATION.json").write_text(
              json.dumps(qualification, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(qualification, indent=2))
          '@ | Set-Content -Encoding UTF8 package308.py

          python package308.py
          if ($LASTEXITCODE -ne 0) { throw "DEV308 package failed" }

      - name: Commit prepared DEV308 candidate
        shell: pwsh
        run: |
          git config user.name "CEO Reliability Engineering"
          git config user.email "ceo-reliability@local.invalid"
          git add ceo-updates/CEO_1.5.84-rc1-executable-route-integrity.zip ceo-updates/DEV308_MANIFEST_UNSIGNED.json ceo-updates/DEV308_QUALIFICATION.json
          git commit -m "Stage DEV308 executable route integrity candidate"
          git push origin HEAD:ceo-update-channel
