name: Test Free Browser AI Worker

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - 'ceo-browser/**'
      - 'ceo-updates/dev313-inspect-routing/**'
      - '.github/workflows/test-free-browser-ai-worker.yml'

permissions:
  contents: read

jobs:
  browser-worker:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: B02 scope freeze guard
        shell: pwsh
        run: |
          @'
          import subprocess
          base="aaf5467c2b507fdda8394fd979e527a3fe02c2d9"
          changed=subprocess.check_output(["git","diff","--name-only",f"{base}...HEAD"],text=True).splitlines()
          exact={
              "ceo-updates/dev313-inspect-routing/ceo_stdlib_work_mode.py",
              "ceo-updates/dev313-inspect-routing/routing.py",
              "ceo-updates/dev313-inspect-routing/providers/chatgpt_web.py",
              ".github/workflows/test-free-browser-ai-worker.yml",
          }
          prefixes=(
              "ceo-browser/",
              "ceo-updates/dev313-inspect-routing/browser_ai/",
          )
          forbidden=[p for p in changed if p not in exact and not p.startswith(prefixes)]
          assert not forbidden, "B02_SCOPE_FREEZE_VIOLATION: "+", ".join(forbidden)
          explicit_frozen=[
              "ceo-updates/mvp_field/",
              "android/",
              "app/src/",
          ]
          assert not any(any(x in p.lower() for x in ["mvp_field","android"]) for p in changed), changed
          print("B02_SCOPE_FREEZE_PASS")
          print("\n".join(changed))
          '@ | Set-Content -Encoding UTF8 b02_scope_guard.py
          python b02_scope_guard.py
          if ($LASTEXITCODE -ne 0) { throw "B02 scope freeze failed" }

      - name: Python contracts and bounded prompt tests
        shell: pwsh
        run: |
          Push-Location ceo-browser
          python -m py_compile browser_ai_worker.py programming_browser_loop.py test_browser_ai_worker.py test_programming_browser_loop.py test_harness_server.py
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          python -m unittest -v test_browser_ai_worker.py test_programming_browser_loop.py
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }
          Pop-Location

      - name: CEO browser-first source contract
        shell: pwsh
        run: |
          python -m py_compile ceo-updates\dev313-inspect-routing\ceo_stdlib_work_mode.py
          python -m py_compile ceo-updates\dev313-inspect-routing\routing.py
          python -m py_compile ceo-updates\dev313-inspect-routing\providers\chatgpt_web.py
          @'
          from pathlib import Path
          work=Path("ceo-updates/dev313-inspect-routing/ceo_stdlib_work_mode.py").read_text(encoding="utf-8")
          routing=Path("ceo-updates/dev313-inspect-routing/routing.py").read_text(encoding="utf-8")
          provider=Path("ceo-updates/dev313-inspect-routing/providers/chatgpt_web.py").read_text(encoding="utf-8")
          assert 'primary_ai_surface = "chatgpt-web"' in work
          assert 'self.no_api_required = True' in work
          assert 'CEO_ALLOW_OPTIONAL_API' in work
          assert 'providers.insert(0, self.AIWorkerProvider(self.browser_transport))' in work
          assert 'from ceo_core.providers.gemini_interactions import GeminiInteractionsTransport' in work
          # The Gemini import must be inside the lazy optional helper, not CEOEngine startup.
          assert work.index('def _gemini_transport_class') < work.index('from ceo_core.providers.gemini_interactions import GeminiInteractionsTransport')
          assert 'execution_enabled = False' not in work
          assert 'Primero activa y valida Gemini' not in work
          assert 'Gemini no está validado' not in work
          assert 'browser_first_cold_start' in routing
          assert 'p.kind.value == "browser"' in routing
          assert 'kind = WorkerKind.BROWSER' in provider
          assert 'async def probe_control' in provider
          assert '"api_calls": 0' in provider
          assert '"paid_api_calls": 0' in provider
          assert 'api.openai.com' not in provider.lower()
          assert 'browser_control_verified' in work
          assert 'BROWSER_CONTROL_READY' in work
          assert 'No se detecto automaticamente una Gemini API key valida.' not in work
          assert 'CEO_BROWSER_PROFILE.json' in provider
          assert 'async def probe_session' in provider
          print("CEO_BROWSER_FIRST_SOURCE_PASS")
          '@ | Set-Content -Encoding UTF8 browser_first_source.py
          python browser_first_source.py
          if ($LASTEXITCODE -ne 0) { throw "browser-first source contract failed" }

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "ceo-browser\windows_chatgpt_cdp_driver.ps1"),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Host $_.Message }; throw "PowerShell driver parse failed"}
          $tokens2=$null
          $errors2=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "ceo-browser\open_chatgpt_profile.ps1"),[ref]$tokens2,[ref]$errors2)
          if($errors2.Count -gt 0){$errors2 | ForEach-Object { Write-Host $_.Message }; throw "PowerShell login helper parse failed"}

      - name: Start local fake web AI
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "ceo-browser\test_harness_server.py" -WindowStyle Hidden
          Start-Sleep -Seconds 1
          $r=Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/ -TimeoutSec 3
          if($r.StatusCode -ne 200){throw "harness not healthy"}

      - name: B03 locate open and control Chrome through CDP
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-browser-probe-profile"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9226","-TimeoutSeconds","30","-ProbeOnly")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B03 browser probe failed: $raw"}
          if($row.status -ne "BROWSER_CONTROL_READY"){throw "unexpected B03 status: $($row.status)"}
          if(-not $row.browser_executable){throw "browser executable not reported"}
          if(-not $row.cdp_port){throw "CDP port not reported"}
          Write-Host "B03_BROWSER_CONTROL_PASS"

      - name: B04 exclusive persistent CEO browser profile
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b04-profile"
          $target="http://127.0.0.1:8765/?seed=1"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\open_chatgpt_profile.ps1","-ProfileDir",$profile,"-Port","9240","-TimeoutSeconds","30","-RecipePath","ceo-browser\recipes\test_harness.json","-DriverPath","ceo-browser\windows_chatgpt_cdp_driver.ps1","-TargetUrl",$target,"-CloseBrowserAfter")
          & powershell.exe @args
          if($LASTEXITCODE -ne 0){throw "B04 profile setup failed"}
          $marker=Get-Content -Raw -Encoding UTF8 (Join-Path $profile "CEO_BROWSER_PROFILE.json") | ConvertFrom-Json
          if(-not $marker.exclusive_profile){throw "B04 exclusive profile marker missing"}
          if($marker.no_api_required -ne $true){throw "B04 no-api marker missing"}
          if($marker.profile_dir -ne $profile){throw "B04 profile path mismatch"}
          $session=Get-Content -Raw -Encoding UTF8 (Join-Path $profile "CEO_BROWSER_SESSION.json") | ConvertFrom-Json
          if(-not $session.ok){throw "B04 session setup not ready"}
          Write-Host "B04_PROFILE_CONTRACT_PASS"
          Start-Sleep -Seconds 2

      - name: B05 fresh profile reports login required instead of bypassing it
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b05-fresh"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9241","-TimeoutSeconds","20","-SessionProbeOnly","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          $code=$LASTEXITCODE
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if($code -eq 0){throw "fresh profile unexpectedly passed login gate"}
          if($row.status -ne "LOGIN_REQUIRED"){throw "expected LOGIN_REQUIRED, got $($row.status)"}
          Write-Host "B05_LOGIN_REQUIRED_PASS"
          $global:LASTEXITCODE=0
          Start-Sleep -Seconds 2

      - name: B05 manual-login completion path reaches session ready
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b05-login"
          $target="http://127.0.0.1:8765/?seed=1"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\open_chatgpt_profile.ps1","-ProfileDir",$profile,"-Port","9242","-TimeoutSeconds","30","-RecipePath","ceo-browser\recipes\test_harness.json","-DriverPath","ceo-browser\windows_chatgpt_cdp_driver.ps1","-TargetUrl",$target,"-CloseBrowserAfter")
          & powershell.exe @args
          if($LASTEXITCODE -ne 0){throw "B05 login-completion path failed"}
          $session=Get-Content -Raw -Encoding UTF8 (Join-Path $profile "CEO_BROWSER_SESSION.json") | ConvertFrom-Json
          if($session.status -ne "SESSION_READY"){throw "B05 session not ready"}
          if(-not $session.logged_in_evidence){throw "B05 logged-in evidence not detected in harness"}
          Write-Host "B05_MANUAL_LOGIN_FLOW_PASS"
          Start-Sleep -Seconds 2

      - name: B06 reopen reuses the same persisted session
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b05-login"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9243","-TimeoutSeconds","30","-SessionProbeOnly","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B06 persisted session not reusable"}
          if($row.status -ne "SESSION_READY"){throw "B06 unexpected status: $($row.status)"}
          if(-not $row.logged_in_evidence){throw "B06 persistent login evidence lost"}
          Write-Host "B06_SESSION_REUSE_PASS"
          Start-Sleep -Seconds 2

      - name: B07 navigation uses CDP and not screen coordinates
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b07-profile"
          $first="http://127.0.0.1:8765/?seed=1"
          $args1=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9244","-TimeoutSeconds","30","-ConversationUrl",$first,"-ProbeOnly")
          $r1=& powershell.exe @args1
          if($LASTEXITCODE -ne 0){throw "B07 initial browser launch failed: $r1"}
          $second="http://127.0.0.1:8765/?variant=fallback"
          $args2=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9244","-TimeoutSeconds","30","-ConversationUrl",$second,"-ProbeOnly","-NoLaunch","-CloseBrowserAfter")
          $r2=& powershell.exe @args2
          Write-Host $r2
          $row=$r2 | ConvertFrom-Json
          if(-not $row.ok){throw "B07 navigation failed"}
          if(-not $row.navigation_used){throw "B07 did not exercise Page.navigate"}
          if($row.conversation_url -notlike "$second*"){throw "B07 wrong destination: $($row.conversation_url)"}
          $driver=Get-Content -Raw -Encoding UTF8 "ceo-browser\windows_chatgpt_cdp_driver.ps1"
          if($driver -match "SetCursorPos|mouse_event|SendKeys"){throw "B07 forbidden coordinate/keystroke navigation found"}
          Write-Host "B07_CDP_NAVIGATION_PASS"
          Start-Sleep -Seconds 2

      - name: B08 prompt input survives missing primary selectors
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b08-profile"
          $target="http://127.0.0.1:8765/?variant=semantic&seed=1"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness_semantic.json","-Prompt","B08_SEMANTIC_INPUT","-ConversationUrl",$target,"-ProfileDir",$profile,"-Port","9245","-TimeoutSeconds","30","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B08 semantic prompt discovery failed"}
          if($row.input_strategy -ne "semantic-fallback"){throw "B08 fallback not used: $($row.input_strategy)"}
          if($row.response -notmatch "B08_SEMANTIC_INPUT"){throw "B08 wrong response"}
          Write-Host "B08_SEMANTIC_PROMPT_PASS"
      - name: Drive Chrome like a browser worker first turn
        id: first
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-browser-profile"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-Prompt","PRIMER_TURNO","-ProfileDir",$profile,"-Port","9227","-TimeoutSeconds","30")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "browser turn 1 failed: $raw"}
          if($row.response -notmatch "HARNESS_RESPONSE: PRIMER_TURNO"){throw "wrong response: $($row.response)"}
          "conversation_url=$($row.conversation_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Continue same browser conversation second turn
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-browser-profile"
          $url="${{ steps.first.outputs.conversation_url }}"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-Prompt","SEGUNDO_TURNO","-ConversationUrl",$url,"-ProfileDir",$profile,"-Port","9227","-TimeoutSeconds","30","-NoLaunch")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "browser turn 2 failed: $raw"}
          if($row.response -notmatch "HARNESS_RESPONSE: SEGUNDO_TURNO"){throw "wrong second response: $($row.response)"}

      - name: Exercise CEO AITransport through Chrome with zero API keys
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP "ceo-browser-transport-test"
          New-Item -ItemType Directory -Force -Path "$pkg\ceo_core\providers" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg\ceo_core\browser_ai\recipes" | Out-Null
          Set-Content -Encoding UTF8 "$pkg\ceo_core\__init__.py" ""
          Set-Content -Encoding UTF8 "$pkg\ceo_core\providers\__init__.py" ""
          Copy-Item "ceo-updates\dev313-inspect-routing\providers\chatgpt_web.py" "$pkg\ceo_core\providers\chatgpt_web.py"
          Copy-Item "ceo-browser\windows_chatgpt_cdp_driver.ps1" "$pkg\ceo_core\browser_ai\windows_chatgpt_cdp_driver.ps1"
          Copy-Item "ceo-browser\recipes\test_harness.json" "$pkg\ceo_core\browser_ai\recipes\test_harness.json"
          @'
          from dataclasses import dataclass, field
          from typing import Any
          class AITransport: pass
          @dataclass
          class AITransportRequest:
              prompt: str
              conversation_id: str|None=None
              turn_index: int=0
              metadata: dict[str,Any]=field(default_factory=dict)
          @dataclass
          class AITransportResponse:
              text: str
              conversation_id: str|None=None
              usage: dict[str,Any]=field(default_factory=dict)
              artifacts: list[str]=field(default_factory=list)
              suggested_followups: list[str]=field(default_factory=list)
              metadata: dict[str,Any]=field(default_factory=dict)
          '@ | Set-Content -Encoding UTF8 "$pkg\ceo_core\ai_worker.py"
          @'
          from dataclasses import dataclass, field
          from enum import Enum
          from typing import Any
          class WorkerKind(str,Enum):
              API="api"; BROWSER="browser"; LOCAL="local"; FILE="file"; MOCK="mock"
          @dataclass
          class ProviderHealth:
              provider: str
              available: bool=True
              detail: str=""
              metadata: dict[str,Any]=field(default_factory=dict)
          '@ | Set-Content -Encoding UTF8 "$pkg\ceo_core\contracts.py"
          @'
          import asyncio, os, pathlib, sys
          root=pathlib.Path(os.environ["CEO_TRANSPORT_TEST_ROOT"])
          sys.path.insert(0,str(root))
          os.environ["CEO_BROWSER_RECIPE_PATH"]=str(root/"ceo_core"/"browser_ai"/"recipes"/"test_harness.json")
          from ceo_core.ai_worker import AITransportRequest
          from ceo_core.providers.chatgpt_web import ChatGPTWebTransport
          async def main():
              t=ChatGPTWebTransport(profile_dir=root/"profile",port=9231,timeout_seconds=30)
              h=await t.healthcheck()
              assert h.available,h
              p=await t.probe_control()
              assert p.get("ok") is True,p
              assert p.get("status")=="BROWSER_CONTROL_READY",p
              assert p.get("api_required") is False,p
              r1=await t.send(AITransportRequest(prompt="CEO_TRANSPORT_PRIMER_TURNO"))
              assert "CEO_TRANSPORT_PRIMER_TURNO" in r1.text,r1
              assert r1.usage["api_calls"]==0 and r1.usage["paid_api_calls"]==0,r1.usage
              assert r1.conversation_id
              r2=await t.send(AITransportRequest(prompt="CEO_TRANSPORT_SEGUNDO_TURNO",conversation_id=r1.conversation_id,turn_index=1))
              assert "CEO_TRANSPORT_SEGUNDO_TURNO" in r2.text,r2
              assert r2.conversation_id==r1.conversation_id,(r1.conversation_id,r2.conversation_id)
              print("CEO_AI_TRANSPORT_BROWSER_ZERO_API_PASS")
          asyncio.run(main())
          '@ | Set-Content -Encoding UTF8 transport_test.py
          $env:CEO_TRANSPORT_TEST_ROOT=$pkg
          python transport_test.py
          if ($LASTEXITCODE -ne 0) { throw "CEO browser transport integration failed" }

      - name: Enforce free-only and no-production boundaries
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          scope=Path("ceo-browser/BROWSER_AI_WORKER_SCOPE.md").read_text(encoding="utf-8")
          core=Path("ceo-browser/browser_ai_worker.py").read_text(encoding="utf-8")
          coding=Path("ceo-browser/programming_browser_loop.py").read_text(encoding="utf-8")
          driver=Path("ceo-browser/windows_chatgpt_cdp_driver.ps1").read_text(encoding="utf-8")
          recipe=Path("ceo-browser/recipes/chatgpt_web.json").read_text(encoding="utf-8")
          joined="\n".join([core,coding,driver,recipe])
          assert "api.openai.com" not in joined.lower()
          assert "OPENAI_API_KEY" not in joined
          assert "no se modifica" in scope and "MVP_FIELD" in scope
          assert "no se publica una nueva versión de CEO" in scope
          assert "no se usa OpenAI API de pago" in scope
          assert "git push" not in coding.lower()
          assert "git commit" not in coding.lower()
          assert "api.openai.com" not in coding.lower()
          print("FREE_BROWSER_BOUNDARY_PASS")
          '@ | Set-Content -Encoding UTF8 boundary.py
          python boundary.py
          if ($LASTEXITCODE -ne 0) { throw "boundary failed" }
