name: Test Free Browser AI Worker

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - 'ceo-browser/**'
      - 'ceo-updates/dev313-inspect-routing/**'
      - '.github/workflows/test-free-browser-ai-worker.yml'

permissions:
  contents: read

jobs:
  browser-worker:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: B02 scope freeze guard
        shell: pwsh
        run: |
          @'
          import subprocess
          base="aaf5467c2b507fdda8394fd979e527a3fe02c2d9"
          changed=subprocess.check_output(["git","diff","--name-only",f"{base}...HEAD"],text=True).splitlines()
          exact={
              "ceo-updates/dev313-inspect-routing/ceo_stdlib_work_mode.py",
              "ceo-updates/dev313-inspect-routing/routing.py",
              "ceo-updates/dev313-inspect-routing/providers/chatgpt_web.py",
              ".github/workflows/test-free-browser-ai-worker.yml",
          }
          prefixes=(
              "ceo-browser/",
              "ceo-updates/dev313-inspect-routing/browser_ai/",
          )
          forbidden=[p for p in changed if p not in exact and not p.startswith(prefixes)]
          assert not forbidden, "B02_SCOPE_FREEZE_VIOLATION: "+", ".join(forbidden)
          explicit_frozen=[
              "ceo-updates/mvp_field/",
              "android/",
              "app/src/",
          ]
          assert not any(any(x in p.lower() for x in ["mvp_field","android"]) for p in changed), changed
          print("B02_SCOPE_FREEZE_PASS")
          print("\n".join(changed))
          '@ | Set-Content -Encoding UTF8 b02_scope_guard.py
          python b02_scope_guard.py
          if ($LASTEXITCODE -ne 0) { throw "B02 scope freeze failed" }

      - name: Python contracts and bounded prompt tests
        shell: pwsh
        run: |
          Push-Location ceo-browser
          python -m py_compile browser_ai_worker.py programming_browser_loop.py simple_browser_task.py browser_task_state.py durable_browser_task.py sandbox_recovery.py real_code_candidate.py first_trial_safety.py first_trial_orchestrator.py build_first_trial_lab.py build_b19_code_sandbox.py run_b15_b18_physical_task.py run_b20_code_gate.py finalize_browser_field.py run_b38_real_ceo_candidate.py test_browser_ai_worker.py test_programming_browser_loop.py test_simple_browser_task.py test_browser_task_state.py test_real_code_candidate.py test_first_trial_safety.py test_harness_server.py
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          python -m unittest -v test_browser_ai_worker.py test_programming_browser_loop.py test_simple_browser_task.py test_browser_task_state.py test_real_code_candidate.py test_first_trial_safety.py
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }
          Pop-Location

      - name: CEO browser-first source contract
        shell: pwsh
        run: |
          python -m py_compile ceo-updates\dev313-inspect-routing\ceo_stdlib_work_mode.py
          python -m py_compile ceo-updates\dev313-inspect-routing\routing.py
          python -m py_compile ceo-updates\dev313-inspect-routing\providers\chatgpt_web.py
          @'
          from pathlib import Path
          work=Path("ceo-updates/dev313-inspect-routing/ceo_stdlib_work_mode.py").read_text(encoding="utf-8")
          routing=Path("ceo-updates/dev313-inspect-routing/routing.py").read_text(encoding="utf-8")
          provider=Path("ceo-updates/dev313-inspect-routing/providers/chatgpt_web.py").read_text(encoding="utf-8")
          assert 'primary_ai_surface = "chatgpt-web"' in work
          assert 'self.no_api_required = True' in work
          assert 'CEO_ALLOW_OPTIONAL_API' in work
          assert 'providers.insert(0, self.AIWorkerProvider(self.browser_transport))' in work
          assert 'from ceo_core.providers.gemini_interactions import GeminiInteractionsTransport' in work
          # The Gemini import must be inside the lazy optional helper, not CEOEngine startup.
          assert work.index('def _gemini_transport_class') < work.index('from ceo_core.providers.gemini_interactions import GeminiInteractionsTransport')
          assert 'execution_enabled = False' not in work
          assert 'Primero activa y valida Gemini' not in work
          assert 'Gemini no está validado' not in work
          assert 'browser_first_cold_start' in routing
          assert 'p.kind.value == "browser"' in routing
          assert 'kind = WorkerKind.BROWSER' in provider
          assert 'async def probe_control' in provider
          assert '"api_calls": 0' in provider
          assert '"paid_api_calls": 0' in provider
          assert 'api.openai.com' not in provider.lower()
          assert 'browser_control_verified' in work
          assert 'BROWSER_CONTROL_READY' in work
          assert 'No se detecto automaticamente una Gemini API key valida.' not in work
          assert 'CEO_BROWSER_PROFILE.json' in provider
          assert 'async def probe_session' in provider
          print("CEO_BROWSER_FIRST_SOURCE_PASS")
          '@ | Set-Content -Encoding UTF8 browser_first_source.py
          python browser_first_source.py
          if ($LASTEXITCODE -ne 0) { throw "browser-first source contract failed" }

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "ceo-browser\windows_chatgpt_cdp_driver.ps1"),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Host $_.Message }; throw "PowerShell driver parse failed"}
          $tokens2=$null
          $errors2=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "ceo-browser\open_chatgpt_profile.ps1"),[ref]$tokens2,[ref]$errors2)
          if($errors2.Count -gt 0){$errors2 | ForEach-Object { Write-Host $_.Message }; throw "PowerShell login helper parse failed"}

      - name: Start local fake web AI
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "ceo-browser\test_harness_server.py" -WindowStyle Hidden
          Start-Sleep -Seconds 1
          $r=Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/ -TimeoutSec 3
          if($r.StatusCode -ne 200){throw "harness not healthy"}

      - name: B03 locate open and control Chrome through CDP
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-browser-probe-profile"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9226","-TimeoutSeconds","30","-ProbeOnly")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B03 browser probe failed: $raw"}
          if($row.status -ne "BROWSER_CONTROL_READY"){throw "unexpected B03 status: $($row.status)"}
          if(-not $row.browser_executable){throw "browser executable not reported"}
          if(-not $row.cdp_port){throw "CDP port not reported"}
          Write-Host "B03_BROWSER_CONTROL_PASS"

      - name: B04 exclusive persistent CEO browser profile
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b04-profile"
          $target="http://127.0.0.1:8765/?seed=1"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\open_chatgpt_profile.ps1","-ProfileDir",$profile,"-Port","9240","-TimeoutSeconds","30","-RecipePath","ceo-browser\recipes\test_harness.json","-DriverPath","ceo-browser\windows_chatgpt_cdp_driver.ps1","-TargetUrl",$target,"-CloseBrowserAfter")
          & powershell.exe @args
          if($LASTEXITCODE -ne 0){throw "B04 profile setup failed"}
          $marker=Get-Content -Raw -Encoding UTF8 (Join-Path $profile "CEO_BROWSER_PROFILE.json") | ConvertFrom-Json
          if(-not $marker.exclusive_profile){throw "B04 exclusive profile marker missing"}
          if($marker.no_api_required -ne $true){throw "B04 no-api marker missing"}
          if($marker.profile_dir -ne $profile){throw "B04 profile path mismatch"}
          $session=Get-Content -Raw -Encoding UTF8 (Join-Path $profile "CEO_BROWSER_SESSION.json") | ConvertFrom-Json
          if(-not $session.ok){throw "B04 session setup not ready"}
          Write-Host "B04_PROFILE_CONTRACT_PASS"
          Start-Sleep -Seconds 2

      - name: B05 fresh profile reports login required instead of bypassing it
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b05-fresh"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9241","-TimeoutSeconds","20","-SessionProbeOnly","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          $code=$LASTEXITCODE
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if($code -eq 0){throw "fresh profile unexpectedly passed login gate"}
          if($row.status -ne "LOGIN_REQUIRED"){throw "expected LOGIN_REQUIRED, got $($row.status)"}
          Write-Host "B05_LOGIN_REQUIRED_PASS"
          $global:LASTEXITCODE=0
          Start-Sleep -Seconds 2

      - name: B05 manual-login completion path reaches session ready
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b05-login"
          $target="http://127.0.0.1:8765/?seed=1"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\open_chatgpt_profile.ps1","-ProfileDir",$profile,"-Port","9242","-TimeoutSeconds","30","-RecipePath","ceo-browser\recipes\test_harness.json","-DriverPath","ceo-browser\windows_chatgpt_cdp_driver.ps1","-TargetUrl",$target,"-CloseBrowserAfter")
          & powershell.exe @args
          if($LASTEXITCODE -ne 0){throw "B05 login-completion path failed"}
          $session=Get-Content -Raw -Encoding UTF8 (Join-Path $profile "CEO_BROWSER_SESSION.json") | ConvertFrom-Json
          if($session.status -ne "SESSION_READY"){throw "B05 session not ready"}
          if(-not $session.logged_in_evidence){throw "B05 logged-in evidence not detected in harness"}
          Write-Host "B05_MANUAL_LOGIN_FLOW_PASS"
          Start-Sleep -Seconds 2

      - name: B06 reopen reuses the same persisted session
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b05-login"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9243","-TimeoutSeconds","30","-SessionProbeOnly","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B06 persisted session not reusable"}
          if($row.status -ne "SESSION_READY"){throw "B06 unexpected status: $($row.status)"}
          if(-not $row.logged_in_evidence){throw "B06 persistent login evidence lost"}
          Write-Host "B06_SESSION_REUSE_PASS"
          Start-Sleep -Seconds 2

      - name: B07 navigation uses CDP and not screen coordinates
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b07-profile"
          $first="http://127.0.0.1:8765/?seed=1"
          $args1=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9244","-TimeoutSeconds","30","-ConversationUrl",$first,"-ProbeOnly")
          $r1=& powershell.exe @args1
          if($LASTEXITCODE -ne 0){throw "B07 initial browser launch failed: $r1"}
          $second="http://127.0.0.1:8765/?variant=fallback"
          $args2=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9244","-TimeoutSeconds","30","-ConversationUrl",$second,"-ProbeOnly","-NoLaunch","-CloseBrowserAfter")
          $r2=& powershell.exe @args2
          Write-Host $r2
          $row=$r2 | ConvertFrom-Json
          if(-not $row.ok){throw "B07 navigation failed"}
          if(-not $row.navigation_used){throw "B07 did not exercise Page.navigate"}
          if($row.conversation_url -notlike "$second*"){throw "B07 wrong destination: $($row.conversation_url)"}
          $driver=Get-Content -Raw -Encoding UTF8 "ceo-browser\windows_chatgpt_cdp_driver.ps1"
          if($driver -match "SetCursorPos|mouse_event|SendKeys"){throw "B07 forbidden coordinate/keystroke navigation found"}
          Write-Host "B07_CDP_NAVIGATION_PASS"
          Start-Sleep -Seconds 2

      - name: B08 prompt input survives missing primary selectors
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b08-profile"
          $target="http://127.0.0.1:8765/?variant=semantic&seed=1"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness_semantic.json","-Prompt","B08_SEMANTIC_INPUT","-ConversationUrl",$target,"-ProfileDir",$profile,"-Port","9245","-TimeoutSeconds","30","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B08 semantic prompt discovery failed"}
          if($row.input_strategy -ne "semantic-fallback"){throw "B08 fallback not used: $($row.input_strategy)"}
          if($row.response -notmatch "B08_SEMANTIC_INPUT"){throw "B08 wrong response"}
          Write-Host "B08_SEMANTIC_PROMPT_PASS"
      - name: B09 type exact prompt before submit
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b09-profile"
          $prompt="B09_TYPE_EXACT_áéí"
          $target="http://127.0.0.1:8765/?seed=1"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-Prompt",$prompt,"-ConversationUrl",$target,"-ProfileDir",$profile,"-Port","9246","-TimeoutSeconds","30","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B09 failed: $raw"}
          if([int]$row.typed_chars -ne $prompt.Length){throw "B09 typed length mismatch"}
          if($row.response -notmatch [regex]::Escape($prompt)){throw "B09 prompt not preserved"}
          Write-Host "B09_TYPE_VERIFY_PASS"
          Start-Sleep -Seconds 2

      - name: B10 submit with CDP Enter fallback and acknowledge
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b10-profile"
          $target="http://127.0.0.1:8765/?variant=enter&seed=1"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-Prompt","B10_CDP_ENTER","-ConversationUrl",$target,"-ProfileDir",$profile,"-Port","9247","-TimeoutSeconds","30","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B10 failed: $raw"}
          if($row.send_method -ne "cdp-enter"){throw "B10 did not use CDP Enter fallback: $($row.send_method)"}
          if(-not $row.submission_verified){throw "B10 submission not acknowledged"}
          if($row.response -notmatch "B10_CDP_ENTER"){throw "B10 wrong response"}
          Write-Host "B10_SUBMIT_ACK_PASS"
          Start-Sleep -Seconds 2

      - name: B11-B12 detect completion and capture full streamed response
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b11-b12-profile"
          $target="http://127.0.0.1:8765/?seed=1&stream=1"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-Prompt","B11_B12_STREAM","-ConversationUrl",$target,"-ProfileDir",$profile,"-Port","9248","-TimeoutSeconds","30","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B11/B12 failed: $raw"}
          if(-not $row.generation_started){throw "B11 generation start not observed"}
          if(-not $row.busy_seen){throw "B11 busy signal not observed"}
          if($row.completion_reason -ne "busy-cleared-and-response-stable"){throw "B11 wrong completion reason: $($row.completion_reason)"}
          if($row.response -notmatch "B11_B12_STREAM"){throw "B12 prompt content missing"}
          if($row.response -notmatch "COMPLETE_TAIL"){throw "B12 captured response before final tail"}
          if([int]$row.response_chars -ne ([string]$row.response).Length){throw "B12 response length mismatch"}
          Write-Host "B11_B12_COMPLETION_CAPTURE_PASS"
          Start-Sleep -Seconds 2

      - name: B13 first turn settles new chat to conversation URL
        id: b13first
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b13-profile"
          $target="http://127.0.0.1:8765/?seed=1&conversation=transition"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-Prompt","B13_FIRST","-ConversationUrl",$target,"-ProfileDir",$profile,"-Port","9249","-TimeoutSeconds","30")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B13 first turn failed: $raw"}
          if(-not $row.conversation_stable){throw "B13 conversation URL did not stabilize"}
          if($row.conversation_url -notmatch "/c/ceo-b09-b14$"){throw "B13 did not settle to expected conversation URL: $($row.conversation_url)"}
          "conversation_url=$($row.conversation_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "B13_FIRST_TURN_PASS"

      - name: B13 second turn stays in exact same conversation
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "ceo-b13-profile"
          $url="${{ steps.b13first.outputs.conversation_url }}"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-Prompt","B13_SECOND","-ConversationUrl",$url,"-ProfileDir",$profile,"-Port","9249","-TimeoutSeconds","30","-NoLaunch","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "B13 second turn failed: $raw"}
          if($row.conversation_url -ne $url){throw "B13 conversation changed: $($row.conversation_url)"}
          if($row.response -notmatch "B13_SECOND"){throw "B13 wrong second response"}
          Write-Host "B13_SAME_CONVERSATION_PASS"
          Start-Sleep -Seconds 2

      - name: B14 physical gate runner contract
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "ceo-browser\run_b09_b14_physical_gate.ps1"),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Host $_.Message }; throw "B14 runner parse failed"}
          if(-not (Test-Path "ceo-browser\EJECUTAR_B09_B14.cmd")){throw "B14 one-click launcher missing"}
          $contract=Get-Content -Raw -Encoding UTF8 "ceo-browser\B09_B14_CONTRACT.json" | ConvertFrom-Json
          if($contract.B14.turns -ne 2){throw "B14 must require two turns"}
          if(-not $contract.B14.same_conversation_required){throw "B14 same conversation requirement missing"}
          if($contract.B14.api_calls_required -ne 0){throw "B14 API boundary violated"}
          if($contract.B14.physical_verification -ne $false){throw "B14 must remain pending until real user-machine proof"}
          $runner=Get-Content -Raw -Encoding UTF8 "ceo-browser\run_b09_b14_physical_gate.ps1"
          if($runner -notmatch "B14_REAL_CHATGPT_TWO_TURN_PASS"){throw "B14 evidence status missing"}
          if($runner -notmatch "api_calls=0"){throw "B14 zero-API evidence missing"}
          Write-Host "B14_PHYSICAL_RUNNER_READY_PASS"

      - name: B15-B17 structured artifact and safe persistence contract
        shell: pwsh
        run: |
          Push-Location ceo-browser
          @'
          from pathlib import Path
          from browser_ai_worker import BrowserResultProtocol, BrowserTask, PromptSizer
          from simple_browser_task import SafeArtifactStore
          import tempfile

          parsed=BrowserResultProtocol.parse("<CEO_ARTIFACT>abc</CEO_ARTIFACT><CEO_DONE>true</CEO_DONE>")
          assert parsed["artifact"]=="abc"
          assert parsed["done"] is True

          task=BrowserTask(
              task_id="b15",
              objective="Create artifact.",
              acceptance=("Return structured artifact",),
              expected_artifact="result.txt",
          )
          prompt=PromptSizer().classify(task).prompt
          assert "<CEO_ARTIFACT>" in prompt

          with tempfile.TemporaryDirectory() as td:
              store=SafeArtifactStore(td)
              p,digest=store.write("nested/result.txt","abc")
              assert p.is_file() and p.read_text(encoding="utf-8")=="abc"
              assert len(digest)==64
              try:
                  store.write("../escape.txt","bad")
              except ValueError:
                  pass
              else:
                  raise AssertionError("path escape not blocked")
          print("B15_B17_ARTIFACT_CONTRACT_PASS")
          '@ | Set-Content -Encoding UTF8 b15_b17_check.py
          python b15_b17_check.py
          if ($LASTEXITCODE -ne 0) { throw "B15-B17 contract failed" }
          Pop-Location

      - name: B18 first real artifact runner contract
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "ceo-browser\run_b15_b18_physical_gate.ps1"),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Host $_.Message }; throw "B18 PowerShell runner parse failed"}
          if(-not (Test-Path "ceo-browser\EJECUTAR_B15_B18.cmd")){throw "B18 launcher missing"}
          $contract=Get-Content -Raw -Encoding UTF8 "ceo-browser\B15_B20_CONTRACT.json" | ConvertFrom-Json
          if($contract.B18.physical_verification -ne $false){throw "B18 must remain physical-pending"}
          if($contract.B17.api_calls -ne 0){throw "B17 API boundary violated"}
          $runner=Get-Content -Raw -Encoding UTF8 "ceo-browser\run_b15_b18_physical_task.py"
          if($runner -notmatch "B18_REAL_BROWSER_ARTIFACT_PASS"){throw "B18 PASS evidence missing"}
          if($runner -notmatch "CEO_BROWSER_ARTIFACT_OK"){throw "B18 deterministic artifact token missing"}
          Write-Host "B18_PHYSICAL_RUNNER_READY_PASS"

      - name: B19 build isolated failing sandbox
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "b19-sandbox"
          python ceo-browser\build_b19_code_sandbox.py --root $root
          if($LASTEXITCODE -ne 0){throw "B19 sandbox build failed"}
          Push-Location $root
          python -m unittest -q
          $code=$LASTEXITCODE
          if($code -eq 0){throw "B19 intentional baseline bug unexpectedly passed"}
          $count=[int](git rev-list --count HEAD)
          if($count -ne 1){throw "B19 baseline commit count must be exactly one"}
          $remotes=(git remote)
          if($remotes){throw "B19 sandbox must have no remotes"}
          $marker=Get-Content -Raw -Encoding UTF8 "CEO_B19_SANDBOX.json" | ConvertFrom-Json
          if(-not $marker.sandbox -or $marker.production){throw "B19 marker invalid"}
          Pop-Location
          $global:LASTEXITCODE=0
          Write-Host "B19_ISOLATED_SANDBOX_PASS"

      - name: B20 coding gate contract and bounded fake correction
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "ceo-browser\run_b20_code_gate.ps1"),[ref]$tokens,[ref]$errors)
