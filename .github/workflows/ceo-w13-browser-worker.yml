name: CEO W13 Canonical Browser Worker

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - 'ceo-browser/apply_w13_canonical_browser_worker.py'
      - 'ceo-browser/w13_browser_worker_regression.py'
      - 'ceo-browser/build_browser_first_lab.py'
      - '.github/workflows/ceo-w13-browser-worker.yml'

permissions:
  contents: read

jobs:
  w13:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      CEO_ALLOW_OPTIONAL_API: '0'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      PERPLEXITY_API_KEY: ''
      XAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3" psutil httpx
      - name: Compose W6-W12 and reproduce missing Browser Worker
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w13"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force

          $env:CEO_W6_ROOT=$root
          $env:CEO_W7_ROOT=$root
          $env:CEO_W8_ROOT=$root
          $env:CEO_W9_ROOT=$root
          $env:CEO_W10_ROOT=$root
          $env:CEO_W11_ROOT=$root
          $env:CEO_W12_ROOT=$root
          $env:CEO_W13_ROOT=$root

          python ceo-browser\apply_w6_completion_persistence.py
          python ceo-browser\apply_w7_recovery_lineage_cap.py
          python ceo-browser\apply_w8_productivity_truth_fix.py
          python ceo-browser\apply_w9_local_finite_task.py
          python ceo-browser\apply_w10_restart_lease_fix.py
          python ceo-browser\apply_w11_local_idempotency.py
          python ceo-browser\apply_w12_operator_control.py
          if($LASTEXITCODE -ne 0){throw "W13 W6-W12 composition failed"}

          $env:CEO_W13_EXPECT_RAW_GAP='1'
          python ceo-browser\w13_browser_worker_regression.py
          if($LASTEXITCODE -ne 0){throw "W13 raw gap reproduction failed"}
          Remove-Item Env:CEO_W13_EXPECT_RAW_GAP
      - name: Apply W13 canonical Browser Worker
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w13"
          $env:CEO_W13_ROOT=$root
          python ceo-browser\apply_w13_canonical_browser_worker.py
          if($LASTEXITCODE -ne 0){throw "W13 patch failed"}
          python ceo-browser\w13_browser_worker_regression.py
          if($LASTEXITCODE -ne 0){throw "W13 regression failed"}
          python -m compileall -q $root
          if($LASTEXITCODE -ne 0){throw "W13 candidate compile failed"}
          Write-Host "W13_STATIC_INTEGRATION_PASS"
      - name: Exercise packaged Browser Worker through Chrome with zero API keys
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w13"
          $profile=Join-Path $env:RUNNER_TEMP "ceo-w13-browser-profile"
          if(Test-Path $profile){Remove-Item -Recurse -Force $profile}
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $server=Start-Process python -ArgumentList "ceo-browser\test_harness_server.py" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Milliseconds 900
            $env:CEO_W13_RUNTIME_ROOT=$root
            $env:CEO_W13_PROFILE=$profile
            $env:CEO_BROWSER_RECIPE_PATH=(Resolve-Path "ceo-browser\recipes\test_harness_campaign.json").Path
            @'
          import asyncio, json, os, pathlib, sys
          root=pathlib.Path(os.environ["CEO_W13_RUNTIME_ROOT"])
          profile=pathlib.Path(os.environ["CEO_W13_PROFILE"])
          sys.path.insert(0,str(root))
          from ceo_core.ai_worker import AITransportRequest
          from ceo_core.providers.chatgpt_web import ChatGPTWebTransport

          async def main():
              t=ChatGPTWebTransport(root=root/"ceo_core",profile_dir=profile,port=9253,timeout_seconds=45)
              h=await t.healthcheck()
              assert h.available,h
              p=await t.probe_control()
              assert p.get("ok") is True,p
              assert p.get("status")=="BROWSER_CONTROL_READY",p
              r1=await t.send(AITransportRequest(prompt="W13_PACKAGED_BROWSER_TURN_1"))
              assert "W13_PACKAGED_BROWSER_TURN_1" in r1.text,r1
              assert r1.usage.get("api_calls")==0 and r1.usage.get("paid_api_calls")==0,r1.usage
              assert r1.conversation_id,r1
              r2=await t.send(AITransportRequest(prompt="W13_PACKAGED_BROWSER_TURN_2",conversation_id=r1.conversation_id,turn_index=1))
              assert "W13_PACKAGED_BROWSER_TURN_2" in r2.text,r2
              assert r2.conversation_id==r1.conversation_id,(r1.conversation_id,r2.conversation_id)
              assert r2.usage.get("api_calls")==0 and r2.usage.get("paid_api_calls")==0,r2.usage
              print("W13_PACKAGED_BROWSER_TWO_TURN_ZERO_API_PASS")
              print(json.dumps({"conversation":r2.conversation_id,"turn1_chars":len(r1.text),"turn2_chars":len(r2.text)},sort_keys=True))
          asyncio.run(main())
          '@ | Set-Content -Encoding UTF8 w13_packaged_browser_live.py
            python w13_packaged_browser_live.py
            if($LASTEXITCODE -ne 0){throw "W13 packaged Browser Worker live harness failed"}
          } finally {
            if($server -and -not $server.HasExited){Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue}
            $needle=$profile.ToLower()
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine.ToLower().Contains($needle) } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "W13_WINDOWS_CI_PASS"
