name: Verify DEV312 direct Windows from 1.5.86

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev312-windows.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract installed base and DEV312
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tmp186,tmp188 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory tmp186 | Out-Null
          New-Item -ItemType Directory tmp188 | Out-Null
          Expand-Archive ceo-updates/CEO_1.5.86-rc1-provider-session-integrity.zip tmp186
          Expand-Archive ceo-updates/CEO_1.5.88-rc1-provider-trust-integrity.zip tmp188
          python -m pip install --disable-pip-version-check -q -e .\tmp186

      - name: Stage and preflight exact DEV312 with 1.5.86 updater
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path .\tmp186).Path
          @'
          import dataclasses, hashlib, json, pathlib, sys, tempfile
          from ceo_core.in_app_updater import InAppUpdater, UpdateManifest

          repo=pathlib.Path.cwd()
          manifest=json.loads((repo/'ceo-updates/DEV312_MANIFEST_UNSIGNED.json').read_text(encoding='utf-8'))
          artifact=repo/'ceo-updates/CEO_1.5.88-rc1-provider-trust-integrity.zip'
          data=artifact.read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['sha256']
          assert len(data)==manifest['size_bytes']
          assert manifest['min_app_version']=='1.5.86-rc1-provider-session-integrity'

          manifest['url']=artifact.resolve().as_uri()
          allowed={f.name for f in dataclasses.fields(UpdateManifest)}
          m=UpdateManifest(**{k:v for k,v in manifest.items() if k in allowed})

          with tempfile.TemporaryDirectory(prefix='ceo-dev312-win-') as td:
              u=InAppUpdater(data_root=td)
              row=u.stage(m)
              assert row['version']=='1.5.88-rc1-provider-trust-integrity',row
              assert row.get('contract_verified') is True,row
              assert u.progress().get('phase')=='ready_to_install',u.progress()
              pre=u.preflight_staged(row['version'],python_executable=sys.executable,timeout=60)
              assert pre.get('ok') is True,pre
              print(json.dumps({
                  'direct_base':'1.5.86-rc1-provider-session-integrity',
                  'target':row['version'],
                  'stage':True,
                  'preflight':True,
                  'contract_verified':row.get('contract_verified'),
                  'preflight_result':pre,
              },indent=2,default=str))
          '@ | Set-Content -Encoding UTF8 verify312.py
          python verify312.py
          if ($LASTEXITCODE -ne 0) { throw "DEV312 direct stage/preflight failed" }

      - name: Re-run exact provider-trust qualification against packaged target
        shell: pwsh
        run: |
          $root=(Resolve-Path .\tmp188).Path
          $env:CEO_DEV312_BUILD_ROOT=$root
          $env:PYTHONPATH=$root
          python ceo-updates\qualify_dev312_provider_trust_integrity.py
          if ($LASTEXITCODE -ne 0) { throw "DEV312 packaged provider trust qualification failed" }

      - name: Inherited DEV311 semantics present
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root=Path('tmp188')
          ui=(root/'scripts/ceo_stdlib_work_mode.py').read_text(encoding='utf-8')
          launcher=(root/'scripts/launch_current.py').read_text(encoding='utf-8')
          assert "installable=(r&&r.receipt" in ui
          assert "ready_to_install'&&!updateActionBusy" in ui
          assert "EXISTING_INSTANCE_OPENED" in launcher
          assert "--app={url}" in launcher
          assert "_migrate_legacy_gemini_trust" in ui
          assert "TRUSTED_PREVIOUSLY_VERIFIED" in ui
          print('DEV312_DIRECT_WINDOWS_PASS')
          '@ | Set-Content -Encoding UTF8 smoke312.py
          python smoke312.py
          if ($LASTEXITCODE -ne 0) { throw "DEV312 direct semantics smoke failed" }
