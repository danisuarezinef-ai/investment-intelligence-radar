name: Brain Decision Integration CI
on:
  push:
    branches: [integration-brain-decision-v4, integration-v4-clean, integration-decision-lab-v5, next-pre160-integration, pre160-91-110, pre160-111-130, pre160-131-150]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Full test suite
        run: python -m pytest -q
      - name: Pre-1.6 debt audit
        run: python tools/pre160_debt_audit.py
      - name: Pre-1.6 backend integrity audit
        run: python tools/pre160_integrity_ci.py
      - name: Pre-1.6 tasks 201-270 integrity audit
        run: python tools/pre160_201_270_integrity_ci.py
      - name: Pre-1.6 tasks 271-310 integrity audit
        run: python tools/pre160_271_310_integrity_ci.py
      - name: Pre-1.6 tasks 311-370 integrity audit
        run: python tools/pre160_311_370_integrity_ci.py
