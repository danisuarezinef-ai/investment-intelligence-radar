name: Brain Decision Integration CI
on:
  push:
    branches: [integration-brain-decision-v4]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Full test suite
        run: python -m pytest -q
