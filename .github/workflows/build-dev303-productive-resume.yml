      - name: Build deterministic package and qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('/tmp/dev303')
          u=pathlib.Path('ceo-updates')
          version='1.5.79-rc1-productive-resume-gate'
          artifact=f'CEO_{version}.zip'
          out=u/artifact
          c=json.loads((root/'CEO_UPDATE_PACKAGE.json').read_text(encoding='utf-8'))
          required=sorted(c['required_paths'])
          fixed=(2026,9,20,15,45,0)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in required:
                  p=root/rel
                  assert p.is_file(),rel
                  info=zipfile.ZipInfo(rel,date_time=fixed)
                  info.create_system=0;info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          data=out.read_bytes();sha=hashlib.sha256(data).hexdigest();size=len(data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(required)
          manifest={
              'artifact_name':artifact,'channel':'stable','data_schema_version':1,
              'health_path':'/api/health','launcher':'ABRIR_CEO.cmd','manifest_version':2,
              'max_app_version':'','min_app_version':'1.5.78-rc1-reliable-update-handoff',
              'notes':'DEV303 Productive Resume Gate: coherent reliability epoch migration, historical recovery isolation, stale internal control retirement, productive-only liveness gating, and explicit control-only deadlock escape.',
              'package_contract_version':1,'published_at':'2026-09-20T15:45:00Z',
              'release_id':'dev303-1.5.79-rc1-productive-resume-gate','release_sequence':303,
              'release_status':'release','sha256':sha,'signature_alg':'ed25519',
              'size_bytes':size,
              'url':f'https://raw.githubusercontent.com/danisuarezinef-ai/investment-intelligence-radar/ceo-update-channel/ceo-updates/{artifact}',
              'version':version
          }
          qual={
              'candidate':version,'base':'1.5.78-rc1-reliable-update-handoff',
              'release_sequence':303,'tests_passed':True,'clean_extract_passed':True,
              'package_contract_passed':True,'security_passed':True,'failed_tests':0,'security_findings':0,
              'field_663_recovery_regression_passed':True,'productive_only_liveness_gate_passed':True,
              'reliability_epoch_restart_persistence_passed':True,'stale_internal_control_retirement_passed':True,
              'local_candidate_ready':True,'windows_physical_verified':False,'production_ready':False,
              'operator_install_confirmation_required':True,
              'artifact':{'name':artifact,'sha256':sha,'size_bytes':size,'entries':len(required)}
          }
          (u/'DEV303_MANIFEST_UNSIGNED.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (u/'DEV303_QUALIFICATION.json').write_text(json.dumps(qual,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(qual,indent=2))
          PY

