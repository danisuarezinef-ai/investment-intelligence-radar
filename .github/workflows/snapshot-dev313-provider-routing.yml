name: Snapshot DEV313 provider routing

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/snapshot-dev313-provider-routing.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Extract exact DEV313 routing files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dev313-exact ceo-updates/dev313-inspect-routing
          mkdir -p /tmp/dev313-exact ceo-updates/dev313-inspect-routing
          unzip -q ceo-updates/CEO_1.5.89-rc1-deterministic-completion.zip -d /tmp/dev313-exact
          for f in             ceo_core/goal_lock_local_provider_v1.py             ceo_core/routing.py             ceo_core/contracts.py             ceo_core/ai_worker.py             ceo_core/scheduler.py             scripts/ceo_stdlib_work_mode.py; do
            cp "/tmp/dev313-exact/$f" "ceo-updates/dev313-inspect-routing/$(basename "$f")"
          done
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "CEO Reliability Engineering"
          git config user.email "ceo-reliability@local.invalid"
          git add ceo-updates/dev313-inspect-routing
          git commit -m "Snapshot DEV313 provider routing runtime"
          git push origin HEAD:ceo-update-channel
