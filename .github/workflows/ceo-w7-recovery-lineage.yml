name: CEO W7 Recovery Lineage Audit

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - 'ceo-browser/apply_w7_recovery_lineage_cap.py'
      - 'ceo-browser/w7_recovery_lineage_regression.py'
      - '.github/workflows/ceo-w7-recovery-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w7:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3"
      - name: Reproduce raw 1.5.92 lineage bug
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w7-raw"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force
          $env:CEO_W7_ROOT=$root
          python - <<'PY'
          import os, pathlib, sys
          root=pathlib.Path(os.environ["CEO_W7_ROOT"])
          sys.path.insert(0,str(root))
          from ceo_core.models import ProjectState,Task,TaskStatus
          from ceo_core.productive_fallback_orchestrator_v1 import ProductiveFallbackOrchestratorV1
          s=ProjectState(goal="raw W7 reproduction")
          s.metadata["max_productive_replan_generations"]=3
          t=Task(title="dead end",status=TaskStatus.FAILED,attempts=3,max_attempts=3,metadata={"task_role":"productive","stall_replan_generation":3})
          s.tasks[t.id]=t;s.root_task_ids.append(t.id)
          before=set(s.tasks)
          out=ProductiveFallbackOrchestratorV1().apply(s)
          created=set(s.tasks)-before
          assert created, "Raw 1.5.92 no longer reproduces the unbounded replan bug"
          new=s.tasks[next(iter(created))]
          assert int(new.metadata.get("stall_replan_generation",-1))==4
          print("W7_RAW_1592_UNBOUNDED_REPLAN_REPRODUCED")
          PY
      - name: Apply W7 bounded lineage correction
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w7-patched"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force
          $env:CEO_W7_ROOT=$root
          python ceo-browser\apply_w7_recovery_lineage_cap.py
          if($LASTEXITCODE -ne 0){throw "W7 patch failed"}
          python ceo-browser\w7_recovery_lineage_regression.py
          if($LASTEXITCODE -ne 0){throw "W7 regression failed"}
          python -m compileall -q $root
          if($LASTEXITCODE -ne 0){throw "W7 compile failed"}
          Write-Host "W7_RECOVERY_LINEAGE_WINDOWS_CI_PASS"
