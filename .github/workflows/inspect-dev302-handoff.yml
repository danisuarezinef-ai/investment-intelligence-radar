name: Inspect DEV302 handoff behavior

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev302-handoff.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect relaunch flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp302
          mkdir -p tmp302
          unzip -q ceo-updates/CEO_1.5.78-rc1-reliable-update-handoff.zip -d tmp302
          echo '=== install endpoint ==='
          sed -n '1040,1135p' tmp302/scripts/ceo_stdlib_work_mode.py
          echo '=== relaunch_after_update.py ==='
          sed -n '1,360p' tmp302/scripts/relaunch_after_update.py
          echo '=== launch_current.py ==='
          sed -n '1,320p' tmp302/scripts/launch_current.py
          echo '=== restart references ==='
          grep -RInE 'relaunch_after_update|restart-progress|waiting_old_process|launching_new_version|old_pid|terminate|taskkill|8772|8765|webbrowser|start ' tmp302/scripts tmp302/ceo_core --include='*.py' --include='*.cmd' | head -n 1200 || true
