name: Build Windows Setup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest

      - name: Test core
        shell: powershell
        run: python -m pytest -q

      - name: Build application and Setup.exe
        shell: powershell
        run: .\build_windows.ps1

      - name: Verify installer exists
        shell: powershell
        run: |
          if (!(Test-Path 'release/Investment_Intelligence_Radar_Setup.exe')) { throw 'Setup.exe no generado' }
          Get-FileHash 'release/Investment_Intelligence_Radar_Setup.exe' -Algorithm SHA256 | Format-List

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Investment_Intelligence_Radar_Setup
          path: release/Investment_Intelligence_Radar_Setup.exe
          if-no-files-found: error
          retention-days: 30
