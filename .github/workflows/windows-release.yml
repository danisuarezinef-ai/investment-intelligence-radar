name: Build Windows Setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-windows-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize runtime identity
        shell: powershell
        run: python tools/normalize_windows_identity.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest

      - name: Test core
        shell: powershell
        run: python -m pytest -q

      - name: Build application, updater and Setup.exe
        shell: powershell
        run: .\build_windows.ps1

      - name: Smoke launch Simulation Lab
        shell: powershell
        run: |
          if (!(Test-Path 'dist/RadarSimulationLab.exe')) { throw 'RadarSimulationLab.exe no generado' }
          $p = Start-Process -FilePath (Resolve-Path 'dist/RadarSimulationLab.exe') -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          if ($p.HasExited) { throw "RadarSimulationLab.exe terminó prematuramente con código $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Simulation Lab packaged executable stayed alive for smoke window.'

      - name: Verify outputs
        shell: powershell
        run: |
          if (!(Test-Path 'release/Radar_de_Inversion_Setup.exe')) { throw 'Radar de Inversion Setup.exe no generado' }
          if (!(Test-Path 'release/update-channel/RadarUpdate.zip')) { throw 'RadarUpdate.zip no generado' }
          if (!(Test-Path 'release/update-channel/update_manifest.json')) { throw 'update_manifest.json no generado' }
          Get-FileHash 'release/Radar_de_Inversion_Setup.exe' -Algorithm SHA256 | Format-List
          Get-Content 'release/update-channel/update_manifest.json'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Radar_de_Inversion_Setup
          path: release/Radar_de_Inversion_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: Radar_de_Inversion_Update
          path: release/update-channel/*
          if-no-files-found: error
          retention-days: 30

      - name: Decide stable publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $candidate = [version]((Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json).version)
          $publish = 'false'
          try {
            git fetch origin updates:refs/remotes/origin/updates --depth=1
            $raw = git show origin/updates:update_manifest.json
            $stable = [version](($raw | ConvertFrom-Json).version)
            if ($candidate -gt $stable) { $publish = 'true' }
            Write-Host "Candidate=$candidate Stable=$stable Publish=$publish"
          } catch {
            Write-Warning "Could not verify stable channel version; fail-closed and do not publish. $($_.Exception.Message)"
            $publish = 'false'
          }
          "PUBLISH_STABLE=$publish" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish stable update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PUBLISH_STABLE == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: updates
          publish_dir: ./release/update-channel
          force_orphan: true
          commit_message: Publish stable Radar de Inversion update
