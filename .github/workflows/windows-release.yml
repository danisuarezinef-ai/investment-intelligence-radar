name: Build Windows Setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest main build may publish the stable update channel.
# This prevents two near-simultaneous pushes from racing on the updates branch.
concurrency:
  group: radar-windows-stable
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest

      - name: Test core
        shell: powershell
        run: python -m pytest -q

      - name: Build application, updater and Setup.exe
        shell: powershell
        run: .\build_windows.ps1

      - name: Verify outputs
        shell: powershell
        run: |
          if (!(Test-Path 'release/Investment_Intelligence_Radar_Setup.exe')) { throw 'Setup.exe no generado' }
          if (!(Test-Path 'release/update-channel/RadarUpdate.zip')) { throw 'RadarUpdate.zip no generado' }
          if (!(Test-Path 'release/update-channel/update_manifest.json')) { throw 'update_manifest.json no generado' }
          Get-FileHash 'release/Investment_Intelligence_Radar_Setup.exe' -Algorithm SHA256 | Format-List
          Get-Content 'release/update-channel/update_manifest.json'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Investment_Intelligence_Radar_Setup
          path: release/Investment_Intelligence_Radar_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: Investment_Intelligence_Radar_Update
          path: release/update-channel/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: updates
          publish_dir: ./release/update-channel
          force_orphan: true
          commit_message: Publish stable Radar update
