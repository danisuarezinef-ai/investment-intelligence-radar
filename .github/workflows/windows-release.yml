name: Build Windows Setup

on:
  push:
    branches: [main]
    paths:
      - 'Investment_Intelligence_Radar_v1.0_Master_Source.zip'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: powershell
        run: |
          if (!(Test-Path 'Investment_Intelligence_Radar_v1.0_Master_Source.zip')) {
            throw 'Falta Investment_Intelligence_Radar_v1.0_Master_Source.zip en la raiz del repositorio.'
          }

      - name: Extract master source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          Expand-Archive -Path 'Investment_Intelligence_Radar_v1.0_Master_Source.zip' -DestinationPath buildsrc -Force
          if (Test-Path 'buildsrc/v1') {
            Get-ChildItem 'buildsrc/v1' -Force | Move-Item -Destination '.' -Force
          } else {
            Get-ChildItem 'buildsrc' -Force | Move-Item -Destination '.' -Force
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Test core
        shell: powershell
        run: python -m pytest -q

      - name: Build application and Setup.exe
        shell: powershell
        run: .\build_windows.ps1

      - name: Verify installer exists
        shell: powershell
        run: |
          if (!(Test-Path 'release/Investment_Intelligence_Radar_Setup.exe')) { throw 'Setup.exe no generado' }
          Get-FileHash 'release/Investment_Intelligence_Radar_Setup.exe' -Algorithm SHA256 | Format-List

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Investment_Intelligence_Radar_Setup
          path: release/Investment_Intelligence_Radar_Setup.exe
          if-no-files-found: error
          retention-days: 30
