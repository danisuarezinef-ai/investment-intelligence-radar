name: Build DEV305 Endgame Closure

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/build-dev305-endgame-closure.yml'
      - 'ceo-updates/build_dev305_endgame_closure.py'
      - 'ceo-updates/qualify_dev305_endgame_closure.py'

permissions:
  contents: write

jobs:
  build-test-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build candidate source tree
        shell: bash
        run: |
          set -euo pipefail
          python ceo-updates/build_dev305_endgame_closure.py

      - name: Install candidate dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -e /tmp/dev305

      - name: Compile candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dev305
          export PYTHONPATH="$PWD"
          python -m compileall -q .

      - name: Run inherited reliability gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dev305
          export PYTHONPATH="$PWD"
          python scripts/dev292_recovery_failclosed_qualification.py
          python scripts/dev294_internal_update_pipeline_qualification.py
          python scripts/dev295_update_confirm_qualification.py
          python scripts/security_audit.py

      - name: Run DEV305 endgame qualification
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/dev305 python ceo-updates/qualify_dev305_endgame_closure.py

      - name: Build deterministic package and prepared release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('/tmp/dev305')
          u=pathlib.Path('ceo-updates')
          version='1.5.81-rc1-endgame-closure'
          artifact=f'CEO_{version}.zip'
          out=u/artifact
          out.unlink(missing_ok=True)
          contract=json.loads((root/'CEO_UPDATE_PACKAGE.json').read_text(encoding='utf-8'))
          required=sorted(contract['required_paths'])
          fixed=(2026,9,20,20,30,0)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in required:
                  p=root/rel
                  assert p.is_file(),rel
                  info=zipfile.ZipInfo(rel,date_time=fixed)
                  info.create_system=0
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          data=out.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          size=len(data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(required)
          manifest={
            'artifact_name':artifact,
            'channel':'stable',
            'data_schema_version':1,
            'health_path':'/api/health',
            'launcher':'ABRIR_CEO.cmd',
            'manifest_version':2,
            'max_app_version':'',
            'min_app_version':'1.5.80-rc1-provider-resilience',
            'notes':'DEV305 Endgame Closure: provider waits no longer suppress local continuity planning, 99-percent goals can create/recycle final audits, provider-deferred work does not enter fallback churn, WAITING_PROVIDER overrides stale blocked state, and blocked UI always exposes a structured cause.',
            'package_contract_version':1,
            'published_at':'2026-09-20T20:30:00Z',
            'release_id':'dev305-1.5.81-rc1-endgame-closure',
            'release_sequence':305,
            'release_status':'release',
            'sha256':sha,
            'signature_alg':'ed25519',
            'size_bytes':size,
            'url':f'https://raw.githubusercontent.com/danisuarezinef-ai/investment-intelligence-radar/ceo-update-channel/ceo-updates/{artifact}',
            'version':version
          }
          qualification={
            'candidate':version,
            'base':'1.5.80-rc1-provider-resilience',
            'release_sequence':305,
            'tests_passed':True,
            'security_passed':True,
            'endgame_99pct_audit_creation_passed':True,
            'waiting_provider_zero_churn_passed':True,
            'provider_wait_fallback_exclusion_passed':True,
            'actionable_block_reason_passed':True,
            'windows_physical_verified':False,
            'production_ready':False,
            'operator_install_confirmation_required':True,
            'artifact':{'name':artifact,'sha256':sha,'size_bytes':size,'entries':len(required)}
          }
          (u/'DEV305_MANIFEST_UNSIGNED.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (u/'DEV305_QUALIFICATION.json').write_text(json.dumps(qualification,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(qualification,indent=2))
          PY

      - name: Commit prepared candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CEO Release Engineering"
          git config user.email "ceo-release@local.invalid"
          git add ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip ceo-updates/DEV305_MANIFEST_UNSIGNED.json ceo-updates/DEV305_QUALIFICATION.json
          git commit -m "Stage DEV305 endgame closure candidate"
          git push origin HEAD:ceo-update-channel
