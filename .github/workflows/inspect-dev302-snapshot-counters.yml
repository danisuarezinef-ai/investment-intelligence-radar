name: Inspect DEV302 snapshot counters exact

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev302-snapshot-counters.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Snapshot counters
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp302
          mkdir -p tmp302
          unzip -q ceo-updates/CEO_1.5.78-rc1-reliable-update-handoff.zip -d tmp302
          grep -n "async def snapshot" tmp302/scripts/ceo_stdlib_work_mode.py
          start=$(grep -n "async def snapshot" tmp302/scripts/ceo_stdlib_work_mode.py | head -1 | cut -d: -f1)
          end=$((start+220))
          sed -n "${start},${end}p" tmp302/scripts/ceo_stdlib_work_mode.py
          echo '=== models statuses ==='
          sed -n '1,130p' tmp302/ceo_core/models.py
