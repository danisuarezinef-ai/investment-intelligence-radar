name: Inspect 1.5.80 update trust payload

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-1580-update-trust.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Show trust payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp180
          mkdir -p tmp180
          unzip -q ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip -d tmp180
          cat tmp180/ceo_core/update_trust.json
