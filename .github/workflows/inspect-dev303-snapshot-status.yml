name: Inspect DEV303 snapshot status mapping

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev303-snapshot-status.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Snapshot status mapping
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp179
          mkdir -p tmp179
          unzip -q ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip -d tmp179
          grep -nE 'operational_status|productivity_state|ATASCADO|RECUPERANDO|SIN SCHEDULER|scheduler_alive' tmp179/scripts/ceo_stdlib_work_mode.py
          sed -n '610,735p' tmp179/scripts/ceo_stdlib_work_mode.py
