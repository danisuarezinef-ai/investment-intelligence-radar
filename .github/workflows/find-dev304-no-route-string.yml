name: Find DEV304 no executable route string

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/find-dev304-no-route-string.yml'

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Find source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp180
          mkdir -p tmp180
          unzip -q ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip -d tmp180
          grep -RInE 'ruta ejecutable|executable route|no executable|watchdog.*route|route.*executable|no route' tmp180/ceo_core tmp180/scripts --include='*.py' --include='*.html' --include='*.js' || true
