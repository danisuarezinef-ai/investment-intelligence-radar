name: Inspect models for DEV307 regression

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev307-models.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Show model constructors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp182
          mkdir -p tmp182
          unzip -q ceo-updates/CEO_1.5.82-rc1-autonomy-bootstrap.zip -d tmp182
          grep -n "@dataclass\|class Task\|class ProjectState" tmp182/ceo_core/models.py | head -n 80
          sed -n '1,260p' tmp182/ceo_core/models.py
