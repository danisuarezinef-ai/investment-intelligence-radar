name: Build DEV313 Deterministic Completion

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/build-dev313-deterministic-completion.yml'
      - 'ceo-updates/build_dev313_deterministic_completion.py'
      - 'ceo-updates/qualify_dev313_deterministic_completion.py'

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build DEV313 candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ceo-dev313"
          $env:CEO_DEV313_BUILD_ROOT = $root
          python ceo-updates\build_dev313_deterministic_completion.py
          if ($LASTEXITCODE -ne 0) { throw "DEV313 build failed" }

          python -m pip install --disable-pip-version-check -q -e $root
          if ($LASTEXITCODE -ne 0) { throw "DEV313 install failed" }

          "CEO_DEV313_BUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_GATE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_NO_BROWSER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LOCALAPPDATA=$(Join-Path $env:RUNNER_TEMP 'ceo-dev313-localappdata')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APPDATA=$(Join-Path $env:RUNNER_TEMP 'ceo-dev313-appdata')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_GATE_ARTIFACTS=$(Join-Path $env:RUNNER_TEMP 'ceo-dev313-artifacts')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile and focused deterministic-completion qualification
        shell: pwsh
        run: |
          Push-Location $env:CEO_DEV313_BUILD_ROOT
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          Pop-Location

          python ceo-updates\qualify_dev313_deterministic_completion.py
          if ($LASTEXITCODE -ne 0) { throw "DEV313 qualification failed" }

      - name: Inherited safety and updater regression
        shell: pwsh
        run: |
          Push-Location $env:CEO_DEV313_BUILD_ROOT
          python scripts\dev292_recovery_failclosed_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV292 failed" }
          python scripts\dev294_internal_update_pipeline_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV294 failed" }
          python scripts\dev295_update_confirm_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV295 failed" }
          python scripts\security_audit.py
          if ($LASTEXITCODE -ne 0) { throw "security audit failed" }
          Pop-Location

      - name: Re-run identical Autonomy Bootstrap Gates 1-6
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CEO_GATE_ARTIFACTS | Out-Null
          python ceo-updates\autonomy_bootstrap_gate_v1.py
          if ($LASTEXITCODE -ne 0) { throw "ABG1 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v2.py
          if ($LASTEXITCODE -ne 0) { throw "ABG2 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v3.py
          if ($LASTEXITCODE -ne 0) { throw "ABG3 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v4.py
          if ($LASTEXITCODE -ne 0) { throw "ABG4 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v5.py
          if ($LASTEXITCODE -ne 0) { throw "ABG5 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v6.py
          if ($LASTEXITCODE -ne 0) { throw "ABG6 failed" }

      - name: Package deterministic DEV313
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, pathlib, zipfile

          root = pathlib.Path(os.environ["CEO_DEV313_BUILD_ROOT"])
          outdir = pathlib.Path("ceo-updates")
          version = "1.5.89-rc1-deterministic-completion"
          artifact = f"CEO_{version}.zip"
          out = outdir / artifact
          out.unlink(missing_ok=True)

          contract = json.loads((root / "CEO_UPDATE_PACKAGE.json").read_text(encoding="utf-8"))
          assert contract["app_version"] == version
          required = sorted(contract["required_paths"])
          fixed = (2026, 9, 21, 13, 45, 0)

          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for rel in required:
                  p = root / rel
                  assert p.is_file(), rel
                  info = zipfile.ZipInfo(rel, date_time=fixed)
                  info.create_system = 0
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0
                  z.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          data = out.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          size = len(data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == set(required)

          manifest = {
              "artifact_name": artifact,
              "channel": "development",
              "data_schema_version": 1,
              "health_path": "/api/health",
              "launcher": "ABRIR_CEO.cmd",
              "manifest_version": 2,
              "max_app_version": "",
              "min_app_version": "1.5.86-rc1-provider-session-integrity",
              "notes": (
                  "DEV313 development candidate: provider-independent deterministic completion "
                  "certificates, explicit work-complete/pending-field-certification state, no AI "
                  "continuity-audit churn when durable evidence already proves the work complete. "
                  "Field endurance remains non-bypassable. Includes DEV311-DEV312 hardening."
              ),
              "package_contract_version": 1,
              "published_at": "2026-09-21T13:45:00Z",
              "release_id": "dev313-1.5.89-rc1-deterministic-completion",
              "release_sequence": 313,
              "release_status": "development",
              "sha256": sha,
              "signature_alg": "ed25519",
              "size_bytes": size,
              "url": (
                  "https://raw.githubusercontent.com/danisuarezinef-ai/"
                  "investment-intelligence-radar/ceo-update-channel/ceo-updates/" + artifact
              ),
              "version": version,
          }

          qualification = {
              "candidate": version,
              "base": "1.5.88-rc1-provider-trust-integrity",
              "release_sequence": 313,
              "tests_passed": True,
              "security_passed": True,
              "provider_independent_completion": True,
              "field_endurance_non_bypassable": True,
              "pending_certification_no_ai_churn": True,
              "evidence_hash_bound_certificate": True,
              "autonomy_bootstrap_gates_1_6_repassed": True,
              "field_validation_pending": True,
              "production_ready": False,
              "installation_deferred_by_operator": True,
              "artifact": {
                  "name": artifact,
                  "sha256": sha,
                  "size_bytes": size,
                  "entries": len(required),
              },
          }

          (outdir / "DEV313_MANIFEST_UNSIGNED.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (outdir / "DEV313_QUALIFICATION.json").write_text(
              json.dumps(qualification, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(qualification, indent=2))
          '@ | Set-Content -Encoding UTF8 package313.py

          python package313.py
          if ($LASTEXITCODE -ne 0) { throw "DEV313 package failed" }

      - name: Commit DEV313 development candidate
        shell: pwsh
        run: |
          git config user.name "CEO Reliability Engineering"
          git config user.email "ceo-reliability@local.invalid"
          git add ceo-updates/CEO_1.5.89-rc1-deterministic-completion.zip ceo-updates/DEV313_MANIFEST_UNSIGNED.json ceo-updates/DEV313_QUALIFICATION.json
          git commit -m "Stage DEV313 deterministic completion development candidate"
          git push origin HEAD:ceo-update-channel
