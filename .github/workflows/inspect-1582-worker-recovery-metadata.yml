name: Inspect 1.5.82 worker recovery metadata

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-1582-worker-recovery-metadata.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Print exact supervisor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp182
          mkdir -p tmp182
          unzip -q ceo-updates/CEO_1.5.82-rc1-autonomy-bootstrap.zip -d tmp182
          python - <<'PY'
          from pathlib import Path
          s=Path('tmp182/ceo_core/operational_resilience.py').read_text()
          a=s.index('class WorkerRecoverySupervisor')
          b=s.find('\nclass ',a+10)
          print(s[a:b if b>0 else None])
          PY
