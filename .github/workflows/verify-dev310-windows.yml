name: Verify DEV310 on Windows with 1.5.85 updater

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev310-windows.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract current updater and DEV310 candidate
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tmp185,tmp186 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory tmp185 | Out-Null
          New-Item -ItemType Directory tmp186 | Out-Null
          Expand-Archive ceo-updates/CEO_1.5.85-rc1-closure-convergence.zip tmp185
          Expand-Archive ceo-updates/CEO_1.5.86-rc1-provider-session-integrity.zip tmp186
          python -m pip install --disable-pip-version-check -q -e .\tmp185

      - name: Stage and preflight exact DEV310 package
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path .\tmp185).Path
          @'
          import dataclasses, hashlib, json, pathlib, sys, tempfile, time
          from ceo_core.in_app_updater import InAppUpdater, UpdateManifest

          repo=pathlib.Path.cwd()
          manifest=json.loads((repo/'ceo-updates/DEV310_MANIFEST_UNSIGNED.json').read_text(encoding='utf-8'))
          artifact=repo/'ceo-updates/CEO_1.5.86-rc1-provider-session-integrity.zip'
          data=artifact.read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['sha256']
          assert len(data)==manifest['size_bytes']

          manifest['url']=artifact.resolve().as_uri()
          allowed={f.name for f in dataclasses.fields(UpdateManifest)}
          m=UpdateManifest(**{k:v for k,v in manifest.items() if k in allowed})

          with tempfile.TemporaryDirectory(prefix='ceo-dev310-win-') as td:
              u=InAppUpdater(data_root=td)
              row=u.stage(m)
              assert row['version']=='1.5.86-rc1-provider-session-integrity',row
              assert row.get('contract_verified') is True,row
              assert u.progress().get('phase')=='ready_to_install',u.progress()

              pre=u.preflight_staged(row['version'],python_executable=sys.executable,timeout=60)
              assert pre.get('ok') is True,pre
              print(json.dumps({
                  'windows_stage_pass':True,
                  'windows_preflight_pass':True,
                  'version':row['version'],
                  'contract_verified':row.get('contract_verified'),
                  'file_count':row.get('file_count'),
                  'preflight':pre,
              },indent=2,default=str))
          '@ | Set-Content -Encoding UTF8 verify310.py
          python verify310.py
          if ($LASTEXITCODE -ne 0) { throw "DEV310 Windows stage/preflight failed" }

      - name: Exact provider-session regression on Windows
        shell: pwsh
        run: |
          $root=(Resolve-Path .\tmp186).Path
          $env:CEO_DEV310_BUILD_ROOT=$root
          $env:PYTHONPATH=$root
          python ceo-updates\qualify_dev310_provider_session_integrity.py
          if ($LASTEXITCODE -ne 0) { throw "DEV310 Windows provider qualification failed" }

      - name: Provider-session semantics smoke
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root=Path('tmp186')
          work=(root/'scripts/ceo_stdlib_work_mode.py').read_text(encoding='utf-8')
          gem=(root/'ceo_core/providers/gemini_interactions.py').read_text(encoding='utf-8')
          assert '_provider_validation_epoch' in work
          assert 'provider_validation_superseded' in work
          assert 'gemini-authenticated-waiting' in work
          assert 'Gemini autenticado · EN ESPERA' in work
          assert 'PROBE_MODEL_LIMIT = 2' in gem
          assert 'attempts=1' in gem
          print('DEV310_WINDOWS_PROVIDER_SESSION_SEMANTICS_PASS')
          '@ | Set-Content -Encoding UTF8 smoke310.py
          python smoke310.py
          if ($LASTEXITCODE -ne 0) { throw "DEV310 Windows provider semantics smoke failed" }

      - name: Verify recorded qualification remains conservative
        shell: pwsh
        run: |
          @'
          import json, pathlib
          q=json.loads(pathlib.Path('ceo-updates/DEV310_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert q.get('autonomy_bootstrap_gates_1_6_repassed') is True,q
          assert q.get('tests_passed') is True,q
          assert q.get('production_ready') is False,q
          print('DEV310_QUALIFICATION_CONSERVATIVE_PASS')
          '@ | Set-Content -Encoding UTF8 q310.py
          python q310.py
