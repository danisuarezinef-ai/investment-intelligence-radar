name: Inspect Bootstrap provider contract and completion gate

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-bootstrap-provider-contract.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect contracts and gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp181
          mkdir -p tmp181
          unzip -q ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip -d tmp181
          echo '=== contracts ==='
          sed -n '1,190p' tmp181/ceo_core/contracts.py
          echo '=== mock provider ==='
          cat tmp181/ceo_core/providers/mock.py
          echo '=== completion gate ==='
          cat tmp181/ceo_core/goal_completion_gate.py
          echo '=== planning/decomposer ==='
          cat tmp181/ceo_core/planning.py
          sed -n '1,280p' tmp181/ceo_core/decomposer.py
