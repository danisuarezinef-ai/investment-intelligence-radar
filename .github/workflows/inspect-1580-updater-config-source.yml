name: Inspect 1.5.80 updater config source

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-1580-updater-config-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Show config source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp180
          mkdir -p tmp180
          unzip -q ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip -d tmp180
          echo '=== update_channel.py ==='
          cat tmp180/ceo_core/update_channel.py
          echo '=== updater load_config ==='
          grep -n "def load_config" tmp180/ceo_core/in_app_updater.py
          start=$(grep -n "def load_config" tmp180/ceo_core/in_app_updater.py|cut -d: -f1|head -1); sed -n "${start},$((start+95))p" tmp180/ceo_core/in_app_updater.py
          echo '=== package config candidates ==='
          find tmp180 -maxdepth 3 -type f | grep -Ei 'update|channel|bootstrap' | sort | head -n 300
