name: Pre-1.6 Hardening Production Audit
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify no Windows release bump
        run: |
          python - <<'PY'
          import json
          v=json.load(open('version.json',encoding='utf-8-sig'))['version']
          assert v=='1.5.28', v
          print('Windows stable remains',v)
          PY
      - name: Verify 91-130 production endpoints and trading boundary
        env:
          BASE_URL: https://radar-cloud-production.up.railway.app
        run: |
          set -euo pipefail
          endpoints=(pre160-evidence-v1 pre160-readiness-v2 pre160-evidence-authority-v1 pre160-audit-v1 pre160-hardening-v1 pre160-hardening-authority-v1 pre160-audit-111-130-v1)
          for endpoint in "${endpoints[@]}"; do
            ok=0
            for attempt in $(seq 1 12); do
              code=$(curl -sS -o "/tmp/$endpoint.json" -w '%{http_code}' --max-time 30 "$BASE_URL/$endpoint" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            test "$ok" = "1" || { echo "$endpoint failed"; cat "/tmp/$endpoint.json" 2>/dev/null || true; exit 1; }
            python - "$endpoint" "/tmp/$endpoint.json" <<'PY'
          import json,sys
          name,path=sys.argv[1:]
          data=json.load(open(path,encoding='utf-8'))
          assert data.get('real_trading') is False,(name,'real_trading boundary')
          for field in ('setup_allowed','automatic_release','automatic_promotion','automatic_demotion'):
              if field in data: assert data.get(field) is False,(name,field)
          print(name,'HTTP 200',data.get('status'),'REAL_TRADING=false')
          PY
          done
