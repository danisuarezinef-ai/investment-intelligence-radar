name: Inspect continuity directive format

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-continuity-directive-format.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect directive parser/controller
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp181
          mkdir -p tmp181
          unzip -q ceo-updates/CEO_1.5.81-rc1-endgame-closure.zip -d tmp181
          grep -RInE 'def extract_directive|class .*Directive|evidence_refs|CEO_GOAL_AUDIT|spawned_tasks|ControllerDecision' tmp181/ceo_core --include='*.py' | head -n 1200
          echo '=== controller ==='
          cat tmp181/ceo_core/controller.py
          echo '=== directive/parser candidates ==='
          for f in tmp181/ceo_core/*.py; do
            if grep -q 'def extract_directive' "$f"; then echo "FILE $f"; cat "$f"; fi
          done
