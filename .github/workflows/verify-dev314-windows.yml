name: Verify DEV314 direct Windows from 1.5.86

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev314-windows.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract 1.5.86 updater and DEV314
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tmp186,tmp189 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory tmp186 | Out-Null
          New-Item -ItemType Directory tmp189 | Out-Null
          Expand-Archive ceo-updates/CEO_1.5.86-rc1-provider-session-integrity.zip tmp186
          Expand-Archive ceo-updates/CEO_1.5.90-rc1-native-transport-integrity.zip tmp189
          python -m pip install --disable-pip-version-check -q -e .\tmp186

      - name: Stage and preflight exact DEV314 package
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path .\tmp186).Path
          @'
          import dataclasses, hashlib, json, pathlib, sys, tempfile
          from ceo_core.in_app_updater import InAppUpdater, UpdateManifest

          repo=pathlib.Path.cwd()
          manifest=json.loads((repo/'ceo-updates/DEV314_MANIFEST_UNSIGNED.json').read_text(encoding='utf-8'))
          artifact=repo/'ceo-updates/CEO_1.5.90-rc1-native-transport-integrity.zip'
          data=artifact.read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['sha256']
          assert len(data)==manifest['size_bytes']

          manifest['url']=artifact.resolve().as_uri()
          allowed={f.name for f in dataclasses.fields(UpdateManifest)}
          m=UpdateManifest(**{k:v for k,v in manifest.items() if k in allowed})

          with tempfile.TemporaryDirectory(prefix='ceo-dev314-win-') as td:
              u=InAppUpdater(data_root=td)
              row=u.stage(m)
              assert row['version']=='1.5.90-rc1-native-transport-integrity',row
              assert row.get('contract_verified') is True,row
              assert u.progress().get('phase')=='ready_to_install',u.progress()
              pre=u.preflight_staged(row['version'],python_executable=sys.executable,timeout=60)
              assert pre.get('ok') is True,pre
              print(json.dumps({
                  'windows_stage_pass':True,
                  'windows_preflight_pass':True,
                  'version':row['version'],
                  'contract_verified':row.get('contract_verified'),
                  'file_count':row.get('file_count'),
                  'preflight':pre,
              },indent=2,default=str))
          '@ | Set-Content -Encoding UTF8 verify313.py
          python verify313.py
          if ($LASTEXITCODE -ne 0) { throw "DEV314 Windows stage/preflight failed" }

      - name: Packaged transport regression
        shell: pwsh
        run: |
          $root=(Resolve-Path .\tmp189).Path
          $env:CEO_DEV314_BUILD_ROOT=$root
          $env:PYTHONPATH=$root
          python ceo-updates\qualify_dev314_native_transport_integrity.py
          if ($LASTEXITCODE -ne 0) { throw "DEV314 packaged regression failed" }

      - name: Exact source smoke
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root=Path('tmp189')
          gem=(root/'ceo_core/providers/gemini_interactions.py').read_text(encoding='utf-8')
          ui=(root/'scripts/ceo_stdlib_work_mode.py').read_text(encoding='utf-8')
          launcher=(root/'scripts/launch_current.py').read_text(encoding='utf-8')
          assert 'local_address="0.0.0.0"' in gem
          assert '_windows_native_request_json' in gem
          assert 'stdin=asyncio.subprocess.PIPE' in gem
          assert 'provider_outage' not in ui or 'provider_wait_v1' in ui
          assert "Gemini no está validado. Actívalo primero" not in ui[ui.index('async def start_project'):ui.index('async def activate_gemini')]
          assert 'EXISTING_INSTANCE_OPENED' in launcher
          assert (root/'ceo_core/deterministic_completion_certifier_v1.py').is_file()
          print('DEV314_WINDOWS_EXACT_SOURCE_PASS')
          '@ | Set-Content -Encoding UTF8 smoke313.py
          python smoke313.py
          if ($LASTEXITCODE -ne 0) { throw "DEV314 exact source smoke failed" }
