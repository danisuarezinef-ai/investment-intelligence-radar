name: Verify DEV303 on Windows with 1.5.78 updater
# DEV303 rebuild verification trigger

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev303-windows.yml'
      - 'ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip'
      - 'ceo-updates/DEV303_MANIFEST_UNSIGNED.json'

permissions:
  contents: read

jobs:
  stage-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract 1.5.78 and install dependencies
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tmp178 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory tmp178 | Out-Null
          Expand-Archive ceo-updates/CEO_1.5.78-rc1-reliable-update-handoff.zip tmp178
          python -m pip install --disable-pip-version-check -q -e .\tmp178
      - name: Stage and preflight DEV303
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path .\tmp178).Path
          @'
          import dataclasses,json,pathlib,tempfile,time,sys
          from ceo_core.in_app_updater import InAppUpdater,UpdateManifest
          repo=pathlib.Path.cwd()
          p=json.loads((repo/'ceo-updates/DEV303_MANIFEST_UNSIGNED.json').read_text(encoding='utf-8'))
          p['url']=(repo/'ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip').resolve().as_uri()
          allowed={f.name for f in dataclasses.fields(UpdateManifest)}
          m=UpdateManifest(**{k:v for k,v in p.items() if k in allowed})
          with tempfile.TemporaryDirectory(prefix='ceo-dev303-win-') as td:
              u=InAppUpdater(data_root=td)
              t=time.perf_counter()
              row=u.stage(m)
              staged=time.perf_counter()-t
              assert row['version']=='1.5.79-rc1-productive-resume-gate'
              assert row.get('contract_verified') is True
              assert u.progress().get('phase')=='ready_to_install'
              t=time.perf_counter()
              pre=u.preflight_staged(row['version'],python_executable=sys.executable,timeout=60)
              elapsed=time.perf_counter()-t
              assert pre.get('ok') is True,pre
              print(json.dumps({
                  'stage_seconds':staged,
                  'preflight_seconds':elapsed,
                  'version':row['version'],
                  'contract_verified':row.get('contract_verified'),
                  'file_count':row.get('file_count'),
                  'preflight':pre,
                  'progress':u.progress(),
              },indent=2,default=str))
          '@ | Set-Content -Encoding UTF8 .\verify303.py
          python .\verify303.py
