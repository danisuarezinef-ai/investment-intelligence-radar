name: Inspect 1.5.82 autonomy gate field failure

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-1582-autonomy-field-failure.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect orphan future, recovery and quality gate paths
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp182
          mkdir -p tmp182
          unzip -q ceo-updates/CEO_1.5.82-rc1-autonomy-bootstrap.zip -d tmp182

          echo '=== orphan_running references ==='
          grep -RInE 'orphan_running_without_live_future|live_future|future.*running|running.*future|worker recovered|worker_recover' tmp182/ceo_core tmp182/scripts --include='*.py' | head -n 1800 || true

          echo '=== quality gate references ==='
          grep -RInE 'quality_gate_rejected|quality_below_threshold|quality.*threshold|quality gate|quality_gate' tmp182/ceo_core tmp182/scripts --include='*.py' | head -n 1800 || true

          echo '=== scheduler worker lifecycle ==='
          grep -nE 'Future|future|running|recover|orphan|quality_gate|executor|submit' tmp182/ceo_core/scheduler.py | head -n 1800 || true

          echo '=== fallback/blocked route ==='
          grep -RInE 'No existe una ruta ejecutable|operator_block_reason|fallback|BLOQUEADO|blocked_safe' tmp182/ceo_core tmp182/scripts --include='*.py' | head -n 1400 || true
