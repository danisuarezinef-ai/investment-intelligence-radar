name: Android APK RC
on:
  pull_request:
    paths: ['android/**','.github/workflows/android-apk-rc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify PAPER boundary
        run: |
          grep -R 'buildConfigField("boolean","REAL_TRADING","false")' android/app/build.gradle.kts
          ! grep -R -E '(BROKER_API_KEY|BROKER_SECRET|REAL_TRADING.*true)' android/app/src/main
      - name: Hash APK
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android-app-debug.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: radar-android-rc-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-app-debug.sha256
