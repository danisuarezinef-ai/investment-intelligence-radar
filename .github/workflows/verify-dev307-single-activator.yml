name: Verify DEV307 single activator

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/verify-dev307-single-activator.yml'
      - 'ceo-updates/ACTIVAR_DEV307_AUTONOMY_RUNTIME_INTEGRITY_UNICO.cmd'
      - 'ceo-updates/DEV307_AUTONOMY_RUNTIME_INTEGRITY_ACTIVAR.ps1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start mock CEO 1.5.82
        shell: pwsh
        run: |
          @'
          import json
          from http.server import ThreadingHTTPServer,BaseHTTPRequestHandler
          from pathlib import Path
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def sendj(self,row,code=200):
                  b=json.dumps(row).encode()
                  self.send_response(code);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)
              def do_GET(self):
                  if self.path=='/api/health':
                      return self.sendj({'ok':True,'version':'1.5.82-rc1-autonomy-bootstrap'})
                  if self.path.startswith('/api/update/status'):
                      return self.sendj({'current_version':'1.5.82-rc1-autonomy-bootstrap','available':True,'remote':{'version':'1.5.83-rc1-autonomy-runtime-integrity'}})
                  return self.sendj({'error':'not_found'},404)
              def do_POST(self):
                  n=int(self.headers.get('Content-Length') or 0)
                  body=self.rfile.read(n)
                  Path('dev307-request.json').write_bytes(body)
                  if self.path=='/api/internal-release/activate-prepared':
                      return self.sendj({'ok':True,'status':'PUBLISHED','version':'1.5.83-rc1-autonomy-runtime-integrity','remote_verified':True})
                  return self.sendj({'error':'not_found'},404)
          ThreadingHTTPServer(('127.0.0.1',8775),H).serve_forever()
          '@ | Set-Content -Encoding UTF8 mock307.py
          Start-Process python -ArgumentList "mock307.py" -WindowStyle Hidden
          Start-Sleep -Seconds 2

      - name: Run single activator
        shell: cmd
        env:
          CEO_ACTIVATOR_NO_PAUSE: "1"
          CEO_ACTIVATOR_NO_BROWSER: "1"
        run: |
          call ceo-updates\ACTIVAR_DEV307_AUTONOMY_RUNTIME_INTEGRITY_UNICO.cmd
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify request and log
        shell: pwsh
        run: |
          $j=Get-Content dev307-request.json -Raw | ConvertFrom-Json
          $expected='https://raw.githubusercontent.com/danisuarezinef-ai/investment-intelligence-radar/ceo-update-channel/ceo-updates/DEV307_MANIFEST_UNSIGNED.json'
          if($j.manifest_url -ne $expected){throw 'wrong manifest url'}
          $log="$env:LOCALAPPDATA\CEO de IAs\diagnostics\DEV307_AUTONOMY_RUNTIME_INTEGRITY_ACTIVACION.log"
          if(-not (Test-Path $log)){throw 'missing log'}
          $t=Get-Content $log -Raw
          if($t -notmatch 'DEV307 publicada y verificada'){throw 'success missing from log'}
          if($t -notmatch 'remote=1.5.83-rc1-autonomy-runtime-integrity'){throw 'remote visibility check missing'}
          Write-Host 'DEV307_SINGLE_ACTIVATOR_PASS'
