name: Inspect DEV295 control and recovery internals

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev295-control-recovery.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect relevant source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp295
          mkdir -p tmp295
          unzip -q ceo-updates/CEO_1.5.71-rc1-update-confirm-bridge.zip -d tmp295
          echo '=== pause/resume implementation ==='
          sed -n '760,860p' tmp295/scripts/ceo_stdlib_work_mode.py
          echo '=== request dispatch ==='
          sed -n '1028,1085p' tmp295/scripts/ceo_stdlib_work_mode.py
          echo '=== scheduler recovery refs ==='
          grep -RInE 'recover|continuity|watchdog|respawn|reopen|cancelled|canceled|supersed' tmp295/ceo_core/scheduler.py tmp295/ceo_core/*recovery* tmp295/ceo_core/*continuity* tmp295/ceo_core/*watchdog* --include='*.py' | head -n 900 || true
          echo '=== state model cancellation fields ==='
          grep -RInE 'cancelled|canceled|completed_at|paused|metadata' tmp295/ceo_core/models.py tmp295/ceo_core/project_store.py tmp295/ceo_core/store.py tmp295/ceo_core/sqlite_store.py --include='*.py' | head -n 600 || true
