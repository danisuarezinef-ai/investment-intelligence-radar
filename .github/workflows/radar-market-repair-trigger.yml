name: Radar Market Repair Trigger

on:
  push:
    paths:
      - ".github/workflows/radar-market-repair-trigger.yml"

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger safe market pulse and one-time backfill
        shell: bash
        run: |
          set -euo pipefail
          out="$(curl --fail-with-body --retry 2 --retry-delay 2 --max-time 240 -sS             -X POST "https://wvmiludqzdepqmjhfwos.supabase.co/functions/v1/radar-market-pulse"             -H "Content-Type: application/json"             --data '{"source":"github-actions","real_trading":false}')"
          printf '%s\n' "$out"
          RESPONSE="$out" python - <<'PY'
          import json, os
          row=json.loads(os.environ["RESPONSE"])
          assert row.get("ok") is True, row
          assert row.get("real_trading") is False, row
          assert row.get("status") in {"PULSE_OK","PULSE_PARTIAL","SKIPPED_RATE_LIMIT"}, row
          PY
