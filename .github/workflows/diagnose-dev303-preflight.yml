name: Diagnose DEV303 Windows preflight

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/diagnose-dev303-preflight.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect preflight code
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tmp179,tmp178 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory tmp179 | Out-Null
          New-Item -ItemType Directory tmp178 | Out-Null
          Expand-Archive ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip tmp179
          Expand-Archive ceo-updates/CEO_1.5.78-rc1-reliable-update-handoff.zip tmp178
          Write-Host "=== candidate preflight ==="
          Get-Content tmp179\scripts\update_candidate_preflight.py
          Write-Host "=== DPAPI load refs ==="
          Select-String -Path tmp179\scripts\ceo_stdlib_work_mode.py,tmp179\ceo_core\credentials.py -Pattern "DPAPI|CredRead|_load_windows_dpapi|win32crypt|CryptUnprotect|credential" -Context 3,5
      - name: Install dependencies and capture exact preflight failure
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q -e .\tmp178
          $env:PYTHONPATH=(Resolve-Path .\tmp178).Path
          @'
          import dataclasses,json,pathlib,tempfile,sys,traceback
          from ceo_core.in_app_updater import InAppUpdater,UpdateManifest
          repo=pathlib.Path.cwd()
          p=json.loads((repo/'ceo-updates/DEV303_MANIFEST_UNSIGNED.json').read_text(encoding='utf-8'))
          p['url']=(repo/'ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip').resolve().as_uri()
          allowed={f.name for f in dataclasses.fields(UpdateManifest)}
          m=UpdateManifest(**{k:v for k,v in p.items() if k in allowed})
          td=tempfile.mkdtemp(prefix='ceo-dev303-diag-')
          print('DATA_ROOT',td)
          u=InAppUpdater(data_root=td)
          row=u.stage(m)
          print('STAGED',row['root'])
          try:
              print(u.preflight_staged(row['version'],python_executable=sys.executable,timeout=60))
          except Exception:
              traceback.print_exc()
              for name in ['preflight-latest.log','progress.json','operation.json']:
                  f=pathlib.Path(td)/'updates'/name
                  if not f.exists(): f=pathlib.Path(td)/name
                  if f.exists():
                      print('===',f,'===')
                      print(f.read_text(encoding='utf-8',errors='replace'))
              r=pathlib.Path(row['root'])/'CEO_REAL_WORK_INTERFACE_STATUS.json'
              if r.exists():
                  print('=== candidate status ===')
                  print(r.read_text(encoding='utf-8',errors='replace'))
              raise
          '@ | Set-Content -Encoding UTF8 .\diag303.py
          python .\diag303.py
