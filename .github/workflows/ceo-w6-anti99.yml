name: CEO Windows W6 Anti-99 Audit

on:
  push:
    branches:
      - free-browser-ai-worker
    paths:
      - "ceo-browser/qualify_w6_anti99.py"
      - ".github/workflows/ceo-w6-anti99.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependency
        run: python -m pip install "pydantic>=2,<3"
      - name: Run W6 anti-99 gate
        run: python ceo-browser/qualify_w6_anti99.py
