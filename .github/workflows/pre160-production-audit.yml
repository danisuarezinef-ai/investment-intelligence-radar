name: Pre-1.6 Production Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pre160-production-audit.yml'
      - 'cloud_service_v4.py'
      - 'radar_pre160_*.py'
      - 'supabase/functions/radar-pre160-evidence/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify no Windows release bump
        shell: bash
        run: |
          python - <<'PY'
          import json
          v=json.load(open('version.json',encoding='utf-8-sig'))['version']
          assert v=='1.5.28', v
          print('Windows stable remains',v)
          PY
      - name: Verify pre-1.6 production endpoints
        shell: bash
        env:
          BASE_URL: https://radar-cloud-production.up.railway.app
        run: |
          set -euo pipefail
          endpoints=(pre160-evidence-v1 pre160-readiness-v2 pre160-evidence-authority-v1 pre160-audit-v1)
          for endpoint in "${endpoints[@]}"; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -o "/tmp/$endpoint.json" -w '%{http_code}' --max-time 30 "$BASE_URL/$endpoint" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            test "$ok" = "1" || { echo "$endpoint failed"; cat "/tmp/$endpoint.json" 2>/dev/null || true; exit 1; }
            python - "$endpoint" "/tmp/$endpoint.json" <<'PY'
          import json,sys
          name,path=sys.argv[1:]
          data=json.load(open(path,encoding='utf-8'))
          assert data.get('real_trading') is False, (name,'real_trading boundary')
          if 'setup_allowed' in data: assert data.get('setup_allowed') is False, (name,'setup boundary')
          print(name,'HTTP 200',data.get('status'),'REAL_TRADING=false')
          PY
          done
