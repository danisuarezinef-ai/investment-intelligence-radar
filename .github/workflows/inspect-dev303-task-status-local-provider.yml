name: Inspect DEV303 task status and local provider support

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev303-task-status-local-provider.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect exact status/local support
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp179
          mkdir -p tmp179
          unzip -q ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip -d tmp179
          sed -n '1,130p' tmp179/ceo_core/models.py
          echo '=== local provider supports ==='
          grep -nE 'class GoalLockLocalProviderV1|def supports|name =|kind =' tmp179/ceo_core/goal_lock_local_provider_v1.py
          sed -n '1,180p' tmp179/ceo_core/goal_lock_local_provider_v1.py
