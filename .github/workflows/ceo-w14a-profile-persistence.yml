name: CEO W14A Persistent Browser Profile

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - 'ceo-browser/windows_chatgpt_cdp_driver.ps1'
      - 'ceo-browser/open_chatgpt_profile.ps1'
      - 'ceo-browser/w14a_profile_persistence_regression.py'
      - '.github/workflows/ceo-w14a-profile-persistence.yml'

permissions:
  contents: read

jobs:
  w14a:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      CEO_ALLOW_OPTIONAL_API: '0'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      PERPLEXITY_API_KEY: ''
      XAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3" psutil httpx

      - name: Compose accumulated W6-W13 candidate and inspect W14A contract
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w14a-candidate"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force
          $env:CEO_W6_ROOT=$root
          $env:CEO_W7_ROOT=$root
          $env:CEO_W8_ROOT=$root
          $env:CEO_W9_ROOT=$root
          $env:CEO_W10_ROOT=$root
          $env:CEO_W11_ROOT=$root
          $env:CEO_W12_ROOT=$root
          $env:CEO_W13_ROOT=$root
          $env:CEO_W14_ROOT=$root
          python ceo-browser\apply_w6_completion_persistence.py
          python ceo-browser\apply_w7_recovery_lineage_cap.py
          python ceo-browser\apply_w8_productivity_truth_fix.py
          python ceo-browser\apply_w9_local_finite_task.py
          python ceo-browser\apply_w10_restart_lease_fix.py
          python ceo-browser\apply_w11_local_idempotency.py
          python ceo-browser\apply_w12_operator_control.py
          python ceo-browser\apply_w13_canonical_browser_worker.py
          if($LASTEXITCODE -ne 0){throw "W14A composition failed"}
          python ceo-browser\w14a_profile_persistence_regression.py
          if($LASTEXITCODE -ne 0){throw "W14A static contract failed"}
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $root "ceo_core\browser_ai\windows_chatgpt_cdp_driver.ps1"),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | ForEach-Object {Write-Host $_.Message};throw "W14A packaged driver parse failed"}
          Write-Host "W14A_STATIC_CONTRACT_PASS"

      - name: Start local web AI harness
        shell: pwsh
        run: |
          $p=Start-Process python -ArgumentList "ceo-browser\test_harness_server.py" -PassThru -WindowStyle Hidden
          $p.Id | Set-Content -Encoding ASCII (Join-Path $env:RUNNER_TEMP "w14a-harness.pid")
          $deadline=(Get-Date).AddSeconds(20)
          do {
            try{$r=Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/" -TimeoutSec 1; if($r.StatusCode -eq 200){break}}catch{}
            Start-Sleep -Milliseconds 300
          } while((Get-Date) -lt $deadline)
          if(-not $r -or $r.StatusCode -ne 200){throw "W14A harness not ready"}

      - name: Reproduce raw cross-profile CDP attachment
        shell: pwsh
        run: |
          $rawDriver=Join-Path $env:RUNNER_TEMP "w14a-raw-driver.ps1"
          git show 595e12d910e0ad492c25e960e87477ece41d7d1b:ceo-browser/windows_chatgpt_cdp_driver.ps1 | Set-Content -Encoding UTF8 $rawDriver
          if($LASTEXITCODE -ne 0){throw "Unable to materialize pre-W14 driver"}

          $chromeCandidates=@(
            "$env:PROGRAMFILES\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:PROGRAMFILES\Microsoft\Edge\Application\msedge.exe"
          )
          $chrome=$chromeCandidates | Where-Object {$_ -and (Test-Path $_)} | Select-Object -First 1
          if(-not $chrome){throw "Chrome/Edge unavailable"}
          $decoy=Join-Path $env:RUNNER_TEMP "w14a-decoy-profile"
          $wanted=Join-Path $env:RUNNER_TEMP "w14a-wanted-profile"
          $port=9258
          Start-Process -FilePath $chrome -ArgumentList @("--remote-debugging-port=$port","--remote-allow-origins=*","--user-data-dir=$decoy","--no-first-run","--no-default-browser-check","http://127.0.0.1:8765/?seed=1") | Out-Null
          $deadline=(Get-Date).AddSeconds(20)
          do{
            try{$v=Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/version" -TimeoutSec 1;if($v.webSocketDebuggerUrl){break}}catch{}
            Start-Sleep -Milliseconds 250
          }while((Get-Date) -lt $deadline)
          if(-not $v.webSocketDebuggerUrl){throw "Decoy CDP browser did not start"}

          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File",$rawDriver,"-RecipePath","ceo-browser\recipes\test_harness.json","-ConversationUrl","http://127.0.0.1:8765/","-ProfileDir",$wanted,"-Port",[string]$port,"-TimeoutSeconds","20","-ProbeOnly","-NoLaunch")
          $raw=& powershell.exe @args
          $code=$LASTEXITCODE
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if($code -ne 0 -or -not $row.ok){throw "Pre-W14 driver did not reproduce cross-profile attachment"}
          if($row.profile_dir -ne $wanted){throw "Raw reproduction did not claim requested profile"}
          Write-Host "W14A_RAW_CROSS_PROFILE_ATTACHMENT_REPRODUCED"

      - name: Patched driver rejects foreign CDP owner
        shell: pwsh
        run: |
          $wanted=Join-Path $env:RUNNER_TEMP "w14a-wanted-profile"
          $port=9258
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ConversationUrl","http://127.0.0.1:8765/","-ProfileDir",$wanted,"-Port",[string]$port,"-TimeoutSeconds","20","-ProbeOnly","-NoLaunch")
          $raw=& powershell.exe @args
          $code=$LASTEXITCODE
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if($code -eq 0){throw "W14A patched driver accepted foreign CDP browser"}
          if($row.status -ne "BROWSER_PROFILE_OWNERSHIP_CONFLICT"){throw "Unexpected W14A conflict status: $($row.status)"}
          if([int]$row.matched_port_processes -lt 1){throw "W14A did not identify port owner"}
          if([int]$row.matched_profile_processes -ne 0){throw "W14A falsely matched foreign profile"}
          Write-Host "W14A_FOREIGN_PROFILE_REJECTED"
          Get-CimInstance Win32_Process | Where-Object {$_.CommandLine -and $_.CommandLine.ToLower().Contains("--remote-debugging-port=$port")} | ForEach-Object {Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue}
          Start-Sleep -Seconds 2
          $global:LASTEXITCODE=0

      - name: Profile path with spaces owns CDP correctly
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "CEO de IAs\browser profile"
          $port=9259
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ConversationUrl","http://127.0.0.1:8765/","-ProfileDir",$profile,"-Port",[string]$port,"-TimeoutSeconds","30","-ProbeOnly","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          Write-Host $raw
          if($LASTEXITCODE -ne 0){throw "W14A spaced profile launch failed"}
          $row=$raw | ConvertFrom-Json
          if(-not $row.ok){throw "W14A spaced profile not ready"}
          if($row.profile_dir -ne $profile){throw "W14A spaced profile path drifted"}
          Write-Host "W14A_SPACED_PROFILE_OWNERSHIP_PASS"
          Start-Sleep -Seconds 2

      - name: Persistent session survives close reopen and marker tamper
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "CEO de IAs\persistent profile"
          $first="http://127.0.0.1:8765/?seed=1"
          $args1=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\open_chatgpt_profile.ps1","-ProfileDir",$profile,"-Port","9260","-TimeoutSeconds","30","-RecipePath","ceo-browser\recipes\test_harness.json","-DriverPath","ceo-browser\windows_chatgpt_cdp_driver.ps1","-TargetUrl",$first,"-CloseBrowserAfter")
          & powershell.exe @args1
          if($LASTEXITCODE -ne 0){throw "W14A initial persistent session setup failed"}

          @{schema_version=1;owner="tampered";exclusive_profile=$false;provider_surface="other";profile_dir="C:\wrong";no_api_required=$false;created_at="2026-01-01T00:00:00"} | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $profile "CEO_BROWSER_PROFILE.json")

          $args2=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\open_chatgpt_profile.ps1","-ProfileDir",$profile,"-Port","9261","-TimeoutSeconds","30","-RecipePath","ceo-browser\recipes\test_harness.json","-DriverPath","ceo-browser\windows_chatgpt_cdp_driver.ps1","-TargetUrl","http://127.0.0.1:8765/","-CloseBrowserAfter")
          & powershell.exe @args2
          if($LASTEXITCODE -ne 0){throw "W14A persisted session did not survive reopen"}

          $session=Get-Content -Raw -Encoding UTF8 (Join-Path $profile "CEO_BROWSER_SESSION.json") | ConvertFrom-Json
          if(-not $session.ok -or $session.status -ne "SESSION_READY"){throw "W14A reopened session not ready"}
          if(-not $session.logged_in_evidence){throw "W14A persistent login evidence lost"}

          $marker=Get-Content -Raw -Encoding UTF8 (Join-Path $profile "CEO_BROWSER_PROFILE.json") | ConvertFrom-Json
          if(-not $marker.exclusive_profile){throw "W14A marker exclusivity not repaired"}
          if($marker.no_api_required -ne $true){throw "W14A marker no-api invariant not repaired"}
          if($marker.profile_dir -ne $profile){throw "W14A marker path not repaired"}
          if($marker.owner -ne "CEO de IAs"){throw "W14A marker owner not repaired"}
          Write-Host "W14A_SESSION_PERSISTENCE_AND_MARKER_REPAIR_PASS"

      - name: Fresh profile still requires legitimate manual login
        shell: pwsh
        run: |
          $profile=Join-Path $env:RUNNER_TEMP "CEO de IAs\fresh login profile"
          $args=@("-NoProfile","-ExecutionPolicy","Bypass","-File","ceo-browser\windows_chatgpt_cdp_driver.ps1","-RecipePath","ceo-browser\recipes\test_harness.json","-ProfileDir",$profile,"-Port","9262","-TimeoutSeconds","20","-SessionProbeOnly","-CloseBrowserAfter")
          $raw=& powershell.exe @args
          $code=$LASTEXITCODE
          Write-Host $raw
          $row=$raw | ConvertFrom-Json
          if($code -eq 0){throw "W14A fresh profile bypassed login"}
          if($row.status -ne "LOGIN_REQUIRED"){throw "W14A expected LOGIN_REQUIRED, got $($row.status)"}
          $recipe=Get-Content -Raw -Encoding UTF8 "ceo-browser\recipes\chatgpt_web.json" | ConvertFrom-Json
          if($recipe.constraints.no_captcha_bypass -ne $true){throw "W14A CAPTCHA boundary weakened"}
          if($recipe.constraints.no_2fa_bypass -ne $true){throw "W14A 2FA boundary weakened"}
          if($recipe.constraints.manual_login_allowed -ne $true){throw "W14A legitimate manual-login path missing"}
          Write-Host "W14A_LOGIN_BOUNDARY_PASS"
          $global:LASTEXITCODE=0

      - name: W14A focal pass
        shell: pwsh
        run: Write-Host "W14A_WINDOWS_CI_PASS"

      - name: Cleanup harness
        if: always()
        shell: pwsh
        run: |
          $pidPath=Join-Path $env:RUNNER_TEMP "w14a-harness.pid"
          if(Test-Path $pidPath){$hp=[int](Get-Content $pidPath);Stop-Process -Id $hp -Force -ErrorAction SilentlyContinue}
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {$_.CommandLine -and $_.CommandLine.ToLower().Contains("--remote-debugging-port=92")} | ForEach-Object {Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue}
