name: Build DEV306 Autonomy Bootstrap

on:
  push:
    branches:
      - ceo-update-channel
    paths:
      - ".github/workflows/build-dev306-autonomy-bootstrap.yml"
      - "ceo-updates/build_autonomy_bootstrap_candidate.py"
      - "ceo-updates/autonomy_bootstrap_gate_v1.py"
      - "ceo-updates/autonomy_bootstrap_gate_v2.py"
      - "ceo-updates/autonomy_bootstrap_gate_v3.py"
      - "ceo-updates/autonomy_bootstrap_gate_v4.py"
      - "ceo-updates/autonomy_bootstrap_gate_v5.py"
      - "ceo-updates/autonomy_bootstrap_gate_v6.py"

permissions:
  contents: write

jobs:
  build-qualify-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ceo-dev306"
          $env:CEO_BOOTSTRAP_BUILD_ROOT = $root
          python ceo-updates\build_autonomy_bootstrap_candidate.py
          if ($LASTEXITCODE -ne 0) { throw "candidate build failed" }
          python -m pip install --disable-pip-version-check -q -e $root
          if ($LASTEXITCODE -ne 0) { throw "candidate install failed" }
          "CEO_GATE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_NO_BROWSER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LOCALAPPDATA=$(Join-Path $env:RUNNER_TEMP 'ceo-dev306-localappdata')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APPDATA=$(Join-Path $env:RUNNER_TEMP 'ceo-dev306-appdata')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CEO_GATE_ARTIFACTS=$(Join-Path $env:RUNNER_TEMP 'ceo-dev306-artifacts')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile and inherited qualification
        shell: pwsh
        run: |
          Push-Location $env:CEO_GATE_ROOT
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          python scripts\dev292_recovery_failclosed_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV292 failed" }
          python scripts\dev294_internal_update_pipeline_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV294 failed" }
          python scripts\dev295_update_confirm_qualification.py
          if ($LASTEXITCODE -ne 0) { throw "DEV295 failed" }
          python scripts\security_audit.py
          if ($LASTEXITCODE -ne 0) { throw "security audit failed" }
          Pop-Location

      - name: Prepare gate dirs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CEO_GATE_ARTIFACTS | Out-Null

      - name: Autonomy Bootstrap Gates 1-6
        shell: pwsh
        run: |
          python ceo-updates\autonomy_bootstrap_gate_v1.py
          if ($LASTEXITCODE -ne 0) { throw "Gate 1 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v2.py
          if ($LASTEXITCODE -ne 0) { throw "Gate 2 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v3.py
          if ($LASTEXITCODE -ne 0) { throw "Gate 3 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v4.py
          if ($LASTEXITCODE -ne 0) { throw "Gate 4 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v5.py
          if ($LASTEXITCODE -ne 0) { throw "Gate 5 failed" }
          python ceo-updates\autonomy_bootstrap_gate_v6.py
          if ($LASTEXITCODE -ne 0) { throw "Gate 6 failed" }

      - name: Package deterministic DEV306 candidate
        shell: pwsh
        run: |
          @'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['CEO_GATE_ROOT'])
          outdir=pathlib.Path('ceo-updates')
          version='1.5.82-rc1-autonomy-bootstrap'
          artifact=f'CEO_{version}.zip'
          out=outdir/artifact
          out.unlink(missing_ok=True)
          contract=json.loads((root/'CEO_UPDATE_PACKAGE.json').read_text(encoding='utf-8'))
          assert contract['app_version']==version,contract['app_version']
          required=sorted(contract['required_paths'])
          fixed=(2026,9,20,21,50,0)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in required:
                  p=root/rel
                  assert p.is_file(),rel
                  info=zipfile.ZipInfo(rel,date_time=fixed)
                  info.create_system=0
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          data=out.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          size=len(data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(required)

          manifest={
              'artifact_name':artifact,
              'channel':'stable',
              'data_schema_version':1,
              'health_path':'/api/health',
              'launcher':'ABRIR_CEO.cmd',
              'manifest_version':2,
              'max_app_version':'',
              'min_app_version':'1.5.80-rc1-provider-resilience',
              'notes':'DEV306 Autonomy Bootstrap: inherits endgame closure and provider resilience, adds adaptive compact decomposition for bounded goals, preserves full decomposition for complex goals, and passes Autonomy Bootstrap Gates 1-6 including sandbox self-development with production isolation.',
              'package_contract_version':1,
              'published_at':'2026-09-20T21:50:00Z',
              'release_id':'dev306-1.5.82-rc1-autonomy-bootstrap',
              'release_sequence':306,
              'release_status':'release',
              'sha256':sha,
              'signature_alg':'ed25519',
              'size_bytes':size,
              'url':f'https://raw.githubusercontent.com/danisuarezinef-ai/investment-intelligence-radar/ceo-update-channel/ceo-updates/{artifact}',
              'version':version
          }
          qualification={
              'candidate':version,
              'base':'1.5.80-rc1-provider-resilience',
              'inherits':'1.5.81-rc1-endgame-closure',
              'release_sequence':306,
              'tests_passed':True,
              'security_passed':True,
              'bootstrap_gate_1_end_to_end':True,
              'bootstrap_gate_2_consecutive_goals':True,
              'bootstrap_gate_3_restart_resume':True,
              'bootstrap_gate_4_provider_outage_resume':True,
              'bootstrap_gate_5_efficiency':True,
              'bootstrap_gate_6_self_development_sandbox':True,
              'worker_recoveries_gate_5':0,
              'worker_recoveries_gate_6':0,
              'production_isolation_gate_6':True,
              'windows_stage_preflight_passed':False,
              'production_ready':False,
              'operator_install_confirmation_required':True,
              'artifact':{'name':artifact,'sha256':sha,'size_bytes':size,'entries':len(required)}
          }
          (outdir/'DEV306_MANIFEST_UNSIGNED.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (outdir/'DEV306_QUALIFICATION.json').write_text(json.dumps(qualification,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(qualification,indent=2))
          '@ | Set-Content -Encoding UTF8 package306.py
          python package306.py
          if ($LASTEXITCODE -ne 0) { throw "package failed" }

      - name: Commit prepared DEV306 candidate
        shell: pwsh
        run: |
          git config user.name "CEO Release Engineering"
          git config user.email "ceo-release@local.invalid"
          git add ceo-updates/CEO_1.5.82-rc1-autonomy-bootstrap.zip ceo-updates/DEV306_MANIFEST_UNSIGNED.json ceo-updates/DEV306_QUALIFICATION.json
          git commit -m "Stage DEV306 autonomy bootstrap candidate"
          git push origin HEAD:ceo-update-channel
