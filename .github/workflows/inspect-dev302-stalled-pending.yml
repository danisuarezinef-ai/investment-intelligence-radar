name: Inspect DEV302 stalled pending task root cause

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev302-stalled-pending.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect scheduler dispatch and startup state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp302
          mkdir -p tmp302
          unzip -q ceo-updates/CEO_1.5.78-rc1-reliable-update-handoff.zip -d tmp302

          echo '=== scheduler dispatch ==='
          grep -nE 'def (run|tick|schedule|dispatch|start|_run|_tick)|while not self\._stop|TaskStatus\.PENDING|TaskStatus\.RETRY|executor|submit|provider' tmp302/ceo_core/scheduler.py | head -n 900 || true

          echo '=== scheduler main body ==='
          sed -n '1,520p' tmp302/ceo_core/scheduler.py

          echo '=== work mode startup/project activation ==='
          grep -nE 'start_project|activate_project|_start_scheduler|scheduler\.start|execution_enabled|paused|autonomy_enabled|resume|provider|Gemini' tmp302/scripts/ceo_stdlib_work_mode.py | head -n 1200 || true

          echo '=== project/store resume ==='
          grep -RInE 'prepare_for_resume|paused|autonomy_enabled|TaskStatus\.PENDING|TaskStatus\.RETRY|RUNNING' tmp302/ceo_core/store.py tmp302/ceo_core/sqlite_store.py tmp302/ceo_core/project_catalog.py | head -n 700 || true

          echo '=== liveness/reconciler/recovery ==='
          grep -RInE 'pending|stalled|orphan|RUNNING|RETRY|recovery|worker|scheduler' tmp302/ceo_core/liveness.py tmp302/ceo_core/scheduler_reconciler_v1.py tmp302/ceo_core/productive_continuity_gate_v2.py tmp302/ceo_core/recovery_storm_guard_v1.py | head -n 1000 || true
