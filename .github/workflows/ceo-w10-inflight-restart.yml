name: CEO W10 In-Flight Restart Audit

on:
  push:
    branches: [free-browser-ai-worker]
    paths:
      - 'ceo-browser/w10_inflight_restart_regression.py'
      - '.github/workflows/ceo-w10-inflight-restart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w10:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-browser-ai-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3" psutil httpx
      - name: Build cumulative W6-W10 candidate
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w10"
          if(Test-Path $root){Remove-Item -Recurse -Force $root}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path "ceo-updates\CEO_1.5.92-rc1-native-transport-integrity.zip" -DestinationPath $root -Force
          $env:CEO_W6_ROOT=$root
          $env:CEO_W7_ROOT=$root
          $env:CEO_W8_ROOT=$root
          $env:CEO_W9_ROOT=$root
          $env:CEO_W10_ROOT=$root
          python ceo-browser\apply_w6_completion_persistence.py
          if($LASTEXITCODE -ne 0){throw "W10 composition W6 failed"}
          python ceo-browser\apply_w7_recovery_lineage_cap.py
          if($LASTEXITCODE -ne 0){throw "W10 composition W7 failed"}
          python ceo-browser\apply_w8_productivity_truth_fix.py
          if($LASTEXITCODE -ne 0){throw "W10 composition W8 failed"}
          python ceo-browser\apply_w9_local_finite_task.py
          if($LASTEXITCODE -ne 0){throw "W10 composition W9 failed"}
          python ceo-browser\apply_w10_restart_lease_fix.py
          if($LASTEXITCODE -ne 0){throw "W10 restart lease fix failed"}
          python -m compileall -q $root
          if($LASTEXITCODE -ne 0){throw "W10 cumulative candidate compile failed"}
      - name: Interrupt and resume finite local objective
        shell: pwsh
        env:
          CEO_ALLOW_OPTIONAL_API: '0'
          OPENAI_API_KEY: ''
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          PERPLEXITY_API_KEY: ''
          XAI_API_KEY: ''
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ceo-w10"
          $env:CEO_W10_ROOT=$root
          $env:CEO_W9_ROOT=$root
          python ceo-browser\w10_inflight_restart_regression.py
          if($LASTEXITCODE -ne 0){throw "W10 in-flight restart regression failed"}
          Write-Host "W10_WINDOWS_CI_PASS"
