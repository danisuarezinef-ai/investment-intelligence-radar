name: Verify DEV306 on Windows with 1.5.80 updater

on:
  push:
    branches:
      - ceo-update-channel
    paths:
      - ".github/workflows/verify-dev306-windows.yml"
      - "ceo-updates/CEO_1.5.82-rc1-autonomy-bootstrap.zip"
      - "ceo-updates/DEV306_MANIFEST_UNSIGNED.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract 1.5.80 updater
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP "ceo180"
          Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          Expand-Archive ceo-updates\CEO_1.5.80-rc1-provider-resilience.zip $base
          python -m pip install --disable-pip-version-check -q -e $base
          "CEO_BASE_180=$base" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage and preflight exact DEV306 package
        shell: pwsh
        run: |
          $env:PYTHONPATH=$env:CEO_BASE_180
          @'
          import dataclasses,hashlib,json,pathlib,tempfile,time,sys
          from ceo_core.in_app_updater import InAppUpdater,UpdateManifest

          repo=pathlib.Path.cwd()
          manifest=json.loads((repo/'ceo-updates/DEV306_MANIFEST_UNSIGNED.json').read_text(encoding='utf-8'))
          artifact=repo/'ceo-updates/CEO_1.5.82-rc1-autonomy-bootstrap.zip'
          data=artifact.read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['sha256']
          assert len(data)==manifest['size_bytes']
          manifest['url']=artifact.resolve().as_uri()

          allowed={f.name for f in dataclasses.fields(UpdateManifest)}
          m=UpdateManifest(**{k:v for k,v in manifest.items() if k in allowed})

          with tempfile.TemporaryDirectory(prefix='ceo-dev306-win-') as td:
              u=InAppUpdater(data_root=td)
              t=time.perf_counter()
              row=u.stage(m)
              stage_s=time.perf_counter()-t
              assert row['version']=='1.5.82-rc1-autonomy-bootstrap',row
              assert row.get('contract_verified') is True,row
              assert u.progress().get('phase')=='ready_to_install',u.progress()

              t=time.perf_counter()
              pre=u.preflight_staged(row['version'],python_executable=sys.executable,timeout=60)
              pre_s=time.perf_counter()-t
              assert pre.get('ok') is True,pre

              print(json.dumps({
                  'windows_stage_pass':True,
                  'windows_preflight_pass':True,
                  'stage_seconds':stage_s,
                  'preflight_seconds':pre_s,
                  'version':row['version'],
                  'contract_verified':row.get('contract_verified'),
                  'file_count':row.get('file_count'),
                  'preflight':pre,
              },indent=2,default=str))
          '@ | Set-Content -Encoding UTF8 verify306.py
          python verify306.py

      - name: Autonomy bootstrap identity smoke
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP "ceo182"
          Remove-Item -Recurse -Force $candidate -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $candidate | Out-Null
          Expand-Archive ceo-updates\CEO_1.5.82-rc1-autonomy-bootstrap.zip $candidate
          @'
          import json,os,pathlib,sys
          root=pathlib.Path(os.environ['CEO_CANDIDATE_182'])
          sys.path.insert(0,str(root))
          from ceo_core.decomposer import TaskDecomposer
          contract=json.loads((root/'CEO_UPDATE_PACKAGE.json').read_text(encoding='utf-8'))
          assert contract['app_version']=='1.5.82-rc1-autonomy-bootstrap'

          simple=TaskDecomposer().plan('Create a short markdown status note named TEST.md containing PASS and one sentence.')
          assert simple.metadata['decomposition_profile']['mode']=='compact'
          assert len(simple.leaf_tasks)<=6

          complex_goal='Research and compare multiple provider strategies, implement an integration plan, verify risks, and produce a systematic review report.'
          complex_state=TaskDecomposer().plan(complex_goal)
          assert complex_state.metadata['decomposition_profile']['mode']=='full'
          assert len(complex_state.leaf_tasks)>6

          print('DEV306_WINDOWS_ADAPTIVE_DECOMPOSITION_PASS')
          '@ | Set-Content -Encoding UTF8 smoke306.py
          $env:CEO_CANDIDATE_182=$candidate
          python smoke306.py
