name: Inspect DEV303 workmode imports compact
on:
  push:
    branches: [ceo-update-channel]
    paths: ['.github/workflows/inspect-dev303-workmode-imports.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ceo-update-channel}
      - shell: bash
        run: |
          rm -rf /tmp/wm && mkdir -p /tmp/wm
          unzip -q ceo-updates/CEO_1.5.79-rc1-productive-resume-gate.zip -d /tmp/wm
          sed -n '1,95p' /tmp/wm/scripts/ceo_stdlib_work_mode.py
