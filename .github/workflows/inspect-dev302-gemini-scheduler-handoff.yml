name: Inspect DEV302 Gemini scheduler restart handoff

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-dev302-gemini-scheduler-handoff.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp302
          mkdir -p tmp302
          unzip -q ceo-updates/CEO_1.5.78-rc1-reliable-update-handoff.zip -d tmp302
          grep -nE 'def _ensure_scheduler_health|async def activate_gemini|execution_enabled =|self.execution_enabled|scheduler = self.ContinuousScheduler|scheduler.start' tmp302/scripts/ceo_stdlib_work_mode.py
          echo '=== ensure scheduler health ==='
          start=$(grep -n "def _ensure_scheduler_health" tmp302/scripts/ceo_stdlib_work_mode.py | head -1 | cut -d: -f1)
          end=$((start+180))
          sed -n "${start},${end}p" tmp302/scripts/ceo_stdlib_work_mode.py
          echo '=== activate gemini ==='
          start=$(grep -n "async def activate_gemini" tmp302/scripts/ceo_stdlib_work_mode.py | head -1 | cut -d: -f1)
          end=$((start+180))
          sed -n "${start},${end}p" tmp302/scripts/ceo_stdlib_work_mode.py
