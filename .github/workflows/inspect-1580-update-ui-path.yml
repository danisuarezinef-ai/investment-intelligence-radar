name: Inspect 1.5.80 update UI remote-check path

on:
  push:
    branches: [ceo-update-channel]
    paths:
      - '.github/workflows/inspect-1580-update-ui-path.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ceo-update-channel
      - name: Inspect update status routes and UI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp180
          mkdir -p tmp180
          unzip -q ceo-updates/CEO_1.5.80-rc1-provider-resilience.zip -d tmp180
          echo '=== updater status 840-890 ==='
          sed -n '840,895p' tmp180/ceo_core/in_app_updater.py
          echo '=== is newer ==='
          grep -n "def _is_newer_release" tmp180/ceo_core/in_app_updater.py
          start=$(grep -n "def _is_newer_release" tmp180/ceo_core/in_app_updater.py|cut -d: -f1|head -1); sed -n "${start},$((start+35))p" tmp180/ceo_core/in_app_updater.py
          echo '=== update routes ==='
          grep -nE '/api/update/(status|check|stage|install)|include_remote|stage_latest|update_view' tmp180/scripts/ceo_stdlib_work_mode.py | head -n 500
          echo '=== UI updater JS ==='
          grep -nE 'Comprobar ahora|CEO está al día|updateStatus|checkUpdate|/api/update/' tmp180/scripts/ceo_stdlib_work_mode.py | head -n 800
