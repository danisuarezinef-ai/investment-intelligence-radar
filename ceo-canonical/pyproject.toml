[project]
name = "ceo-de-ias"
version = "1.3.42"
description = "CEO de IAs - autonomous project orchestration MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "psutil>=6.0",
  "playwright>=1.50",
  "httpx>=0.27",
  "cryptography>=44.0",
]

[project.optional-dependencies]
windows-desktop = ["pywinauto>=0.6.9", "pyautogui>=0.9.54"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ceo_core*", "ceo_app*"]
